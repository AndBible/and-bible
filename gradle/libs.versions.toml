[versions]
# Toolchain — reference-matched (do not diverge)
agp = "9.2.1"
kotlin = "2.3.21"
ksp = "2.3.9"
gradle = "9.5.1"                 # informational; the wrapper is the source of truth
# AndBible libraries — current values, moved verbatim into the catalog
room3 = "3.0.3"                  # D1.5: Room 3 (androidx.room3) with the bundled SQLite driver
coroutines = "1.11.0"            # bumped from 1.10.2 to the reference level
kotlinxSerialization = "1.8.1"
atomicfu = "0.33.0"
coreKtx = "1.16.0"
jdom = "2.0.6.1"
commonsText = "1.9"
androidxSqlite = "2.7.1"
appcompat = "1.7.1"
lifecycle = "2.9.1"
material = "1.12.0"
koin = "4.1.0"                   # added in Task 2 (latest stable 4.x; adjust if a newer 4.x resolves)
accrescentBundletool = "0.2.4"
composeBom = "2026.06.00"        # added in Task 6 (:app Compose host BOM)
activityCompose = "1.13.0"
roborazzi = "1.67.0"             # golden-image harness (bumped from 1.54.0 — 1.54 uses AGP's removed TestedExtension; 1.67 uses the new AGP-9 variant API)
robolectric = "4.14.1"           # bumped from 4.9 — Roborazzi Compose needs NATIVE graphics (>=4.10)
materialKolor = "2.1.1"          # KMP HCT / M3 dynamic-scheme derivation (A/B batch 4b); latest STABLE (3.0.0 is beta); publishes iossimulatorarm64
reorderable = "3.1.0"            # CMP drag-reorder engine (doc-mgmt Task 1); newest with an iosArm64 variant (verified in .module); API identical to 2.4.x; requires Compose>=1.7.0/Kotlin-stdlib>=1.9.0 (both satisfied)
# JetBrains Compose-Multiplatform navigation (KMP). 2.9.2 is the version matched to CMP 1.11.1 --
# NOT "one version behind" androidx 2.10.0, which publishes linux_x64 as its only native target and
# so cannot be a commonMain dependency of a module that compiles for iOS. Different group
# (org.jetbrains.androidx.navigation) from the held androidx.* artifacts, so no conflict. Verified
# not to escalate compileSdk past 36 (see this task's Step 5).
navigationCompose = "2.9.2"
# Declared explicitly (Task 5) rather than relying on it arriving transitively through
# navigation-compose: the resolved version is two hops deep through a library whose dependency
# graph is not ours (navigation-compose -> ... -> lifecycle-runtime-compose), so an implicit bump
# or drop there would be a silent Android-only failure with nothing in this file to flag it.
# Measured via `./gradlew :sharedUi:dependencies --configuration iosSimulatorArm64CompileKlibraries`.
lifecycleRuntimeCompose = "2.9.6"

[libraries]
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "androidxSqlite" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidxSqlite" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-test-junit4 = { module = "io.insert-koin:koin-test-junit4", version.ref = "koin" }
# Compose (added in Task 6) — :app is a Compose host; versions come from the BOM
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }  # golden-test only (DragHandle etc.); version from the BOM
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# Golden-screenshot harness (added in golden-screenshot spike task)
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
# CMP drag-reorder library (doc-mgmt Task 1) — wrapped behind net.bible.sharedui.components.AbReorderableColumn
materialkolor = { module = "com.materialkolor:material-kolor", version.ref = "materialKolor" }
reorderable = { module = "sh.calvin.reorderable:reorderable", version.ref = "reorderable" }
jetbrains-navigation-compose = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
jetbrains-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
accrescent-bundletool = { id = "app.accrescent.tools.bundletool", version.ref = "accrescentBundletool" }
# Pre-staged for Spec 2 (KMP foundations) — declared, NOT applied anywhere yet
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version = "1.11.1" }
android-kotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
