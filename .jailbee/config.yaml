# jailbee configuration for AndBible
# (Android/Kotlin + Kotlin Multiplatform/Compose, with a Vue.js BibleView).
#
# Reference: https://jailbee.gisgro.com (docs/config.md). Personal settings
# (IDE/browser master switches, credentials, agent logins) belong in
# ~/.config/jailbee/global.yaml, not in this committed file; per-host overrides
# of anything below go in `jailbee config edit --local`.
#
# Host prerequisites for this config:
#   * the Android SDK at ~/Android/Sdk (mounted read-only below)
#   * a running host adb server (`adb start-server`), see "adb" below
#   * optional: /dev/kvm for the in-container emulator

new:
  clone_from: local

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------

# Android Gradle builds are memory-hungry: JVM + Gradle daemon + Kotlin
# compiler easily take 8-12 GiB on a full build, and an in-container emulator
# needs the rest. Lower these for your host in the local layer if needed.
defaults:
  memory: 32GiB
  cpu: 8
  network: strict
  storage_pool: default

# ---------------------------------------------------------------------------
# IDE
# ---------------------------------------------------------------------------

# AndBible is developed with Android Studio, installed via JetBrains Toolbox.
# `ide: studio` matches the Toolbox launcher binary name
# (/opt/jetbrains-toolbox/apps/android-studio/bin/studio.sh). Whether the IDE
# is available at all (`jetbrains.enabled`) and whether it autostarts are
# per-user choices: set them in ~/.config/jailbee/global.yaml.
jetbrains:
  ide: studio

# ---------------------------------------------------------------------------
# Host integration: SDK, adb, KVM
# ---------------------------------------------------------------------------

# The Android SDK is bind-mounted read-only so Gradle finds platforms and
# build-tools without reinstalling them in every container. System images for
# the emulator must therefore be installed on the host SDK.
# Personal mounts (~/.gnupg, ~/.gitconfig, JetBrains Toolbox) belong in
# ~/.config/jailbee/global.yaml.
host_mounts:
  - { host: ~/Android/Sdk, container: /home/dev/Android/Sdk, readonly: true }

# Maintainer-only: the ostickethelper config and password file for
# support.andbible.org (.jailbee/install.d/98-ostickethelper.sh). Not attached
# by default, so ticket credentials are absent from containers until wanted:
#   jailbee mount osticket <container>     # before a ticket session
#   jailbee unmount osticket <container>   # after it
# The ticket inbox and temp files stay in .local/osticket/ (work_dir).
optional_mounts:
  osticket:
    host: ~/.config/andbible-osticket
    container: /home/dev/.osticket
    readonly: true
    description: "support.andbible.org credentials for ostickethelper (maintainer only)"

# adb: one host-side adb server serves both host and container clients. The
# container reaches it over this TCP forward (container 127.0.0.1:5037 ->
# host 127.0.0.1:5037), which lands on adb's default endpoint, so the container
# needs no ADB_SERVER_SOCKET override. Works for USB, `adb tcpip` and Android 11+
# wireless debugging; pair the phone once on the host. Attached by `jailbee new`
# and kept in sync by `jailbee apply` (no rebuild, no restart).
#
# Do NOT export ADB_SERVER_SOCKET on the host: it moves the server onto a Unix
# socket and leaves nothing on :5037 for the forward to reach.
#
# An emulator INSIDE the container must use its own adb server on port 5038
# (the proxy device occupies 5037 in the container); scripts/with-container-adb.sh
# does that. See docs/emulator-and-webview-debugging.md.
host_ports:
  - { name: adb, port: 5037 }

# Host KVM for a hardware-accelerated in-container emulator, so instrumented
# tests and debugging do not depend on a host-side emulator.
#
# SECURITY: this widens the host-kernel attack surface reachable from the
# (unprivileged) container; a KVM bug could in principle be exploited past the
# userns isolation. It grants neither container escape nor host root on its own.
# mode 0666 because raw.idmap maps the dev user's UID but not its `kvm`
# supplementary GID, so the node would otherwise land root:root 0660 and the
# emulator could not open it. A host without /dev/kvm is fine: the device is
# skipped at profile build (an advisory is shown).
host_devices:
  - { path: /dev/kvm, mode: "0666" }

# ---------------------------------------------------------------------------
# Shared caches (bind-mounted from <shared_dir>/<host_subpath>)
# ---------------------------------------------------------------------------

# Without these, each lives on the container's ephemeral overlay and is lost on
# every `jailbee new`. The gradle/npm caches come from `golden.stacks` below.
shared_caches:
  # ~/.cache, which includes the Chromium (~150 MB) that Playwright-based
  # tools download.
  - { name: cache, host_subpath: home-caches, container_path: ~/.cache }
  # ~/.android keeps the generated debug.keystore identical across sessions.
  # Otherwise every session gets a new debug signing key, and `adb install -r`
  # of a debug build fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE against the
  # previous session's install.
  - { name: android-home, host_subpath: android-home, container_path: ~/.android }
  # Kotlin/Native toolchain and dependencies (iOS targets).
  - { name: konan, host_subpath: konan, container_path: ~/.konan }

# ---------------------------------------------------------------------------
# Network (strict mode allowlist)
# ---------------------------------------------------------------------------

# Covers Android Gradle builds, npm dependencies, apt updates and the AndBible
# module repositories. adb uses the `host_ports` forward, not the network.
# Pushing is done from the host, not from the container; for anything else
# that needs the open internet use `jailbee net loose <name>` for that session.
egress_allow:
  # Android / Google
  - dl.google.com
  - maven.google.com
  - android.googlesource.com
  # Maven Central / Gradle
  - repo.maven.apache.org
  - repo1.maven.org
  - plugins.gradle.org
  - services.gradle.org
  - jitpack.io
  # Kotlin/Native (iOS targets)
  - download.jetbrains.com:443
  # Node / npm (app/bibleview-js)
  - registry.npmjs.org
  - registry.yarnpkg.com
  # Playwright browser download (website browser checks, .jailbee/install.d/97-playwright.sh)
  - cdn.playwright.dev:443
  - playwright.download.prss.microsoft.com:443
  # Ubuntu apt
  - archive.ubuntu.com:443
  - security.ubuntu.com:443
  - ports.ubuntu.com:443
  # GitHub: HTTPS submodules (jsword, goldens) and release downloads
  - github.com:443
  - release-assets.githubusercontent.com:443
  # GitHub Actions from the container (read-only `gh run list/view/download`, `gh api`):
  # REST API, run-log downloads (redirect to *.actions.githubusercontent.com /
  # Azure blob storage), artifacts, raw/codeload fetches
  - api.github.com:443
  - objects.githubusercontent.com:443
  - raw.githubusercontent.com:443
  - codeload.github.com:443
  - "*.actions.githubusercontent.com"
  - "*.blob.core.windows.net"
  # Website (website/): Python packages for uv, YouTube catalog + thumbnails, shop link check
  - pypi.org:443
  - files.pythonhosted.org:443
  - youtube.com:443
  - www.youtube.com:443
  - i.ytimg.com:443
  - play.google.com:443
  - shop.andbible.org:443
  # AndBible module repositories (catalogue refresh and module downloads,
  # e.g. in the in-container emulator)
  - andbible.org:443
  - support.andbible.org:443
  # Legacy user documentation (Read the Docs, until the cutover)
  - docs.andbible.org:443
  - crosswire.org:443
  - ebible.org:443
  - ibtrussia.org:443
  - public.modules.stepbible.org:443

# ---------------------------------------------------------------------------
# Container environment
# ---------------------------------------------------------------------------

# Injected via the Incus base profile, so visible in every process (shell,
# tmux, autostart steps, the IDE). There is deliberately no ADB_SERVER_SOCKET
# here; see `host_ports`.
container:
  env:
    ANDROID_HOME: /home/dev/Android/Sdk
    ANDROID_SDK_ROOT: /home/dev/Android/Sdk

# ---------------------------------------------------------------------------
# Golden image
# ---------------------------------------------------------------------------

# Use `golden.stacks`, not bare `golden.java` / `golden.node`: the bare keys
# only pin a version and do not stage the install snippet, so a config with
# only those builds an image with neither Java nor Node. `stacks` pins the
# version AND stages the snippet, and adds the matching gradle/m2/npm/pnpm-store
# shared caches.
#
# Java: the default JDK is 25, but the build pins `jvmToolchain(17)`, and
# Gradle's toolchain resolution needs an exact major match. Without a real
# JDK 17 Gradle would try to auto-download one (foojay/adoptium), which strict
# egress blocks. So openjdk-17-jdk is installed alongside as an extra package;
# Gradle finds it under /usr/lib/jvm, while JDK 25 stays the default `java`
# on PATH/JAVA_HOME.
#
# Node: 24, which has the built-in WebSocket global that the WebView CDP
# tooling (scripts/cdp.mjs) uses.
golden:
  ubuntu_version: "26.04"
  stacks:
    java: "openjdk-25"
    node: 24
  extra_apt_packages:
    - openjdk-17-jdk      # satisfies jvmToolchain(17), see above
    - android-tools-adb   # adb client; the server runs on the host
    - xz-utils            # `xz` for .jailbee/install.d/95-typst.sh (tar -xJf)
    # Shared libraries of Playwright's headless Chromium (.jailbee/install.d/97-playwright.sh)
    - libasound2t64
    - libatk-bridge2.0-0t64
    - libatk1.0-0t64
    - libatspi2.0-0t64
    - libdbus-1-3
    - libdrm2
    - libgbm1
    - libglib2.0-0t64
    - libnspr4
    - libnss3
    - libx11-6
    - libxcb1
    - libxcomposite1
    - libxdamage1
    - libxext6
    - libxfixes3
    - libxkbcommon0
    - libxrandr2

# ---------------------------------------------------------------------------
# Autostart
# ---------------------------------------------------------------------------

# No autostart steps. The docs/superpowers checkout is jailbee's own submodule
# support, and its memory index reaches Claude through an @import in
# docs/superpowers/CLAUDE.md, so no per-project memory symlink is needed.
#
# Steps you could add, e.g. a one-time Vue.js install:
# autostart:
#   step_timeout: 600
#   on_create:
#     - stage: bibleview-install
#       network: loose
#       steps:
#         - name: npm-install
#           run: "npm install"
#           working_dir: app/bibleview-js
