# jailbee configuration for AndBible.
# Android (Kotlin) + Vue.js hybrid app. Java 17 + Node 20 are required;
# Gradle reaches a fairly broad set of Google/Maven mirrors during builds.
# See https://jailbee.gisgro.com (and docs/config.md) for the full reference.

# Chrome is not needed for this repo — turn it off regardless of what
# ~/.config/jailbee/global.yaml says.
chrome:
  enabled: true

new:
  clone_from: local

# IDE: AndBible is developed with Android Studio, installable via
# JetBrains Toolbox. `ide: studio` matches the Toolbox launcher binary
# name (/opt/jetbrains-toolbox/apps/android-studio/bin/studio.sh).
# autostart is OFF by repo policy; flip on per-user in global.yaml if
# you want `jailbee new` to launch the IDE automatically.
jetbrains:
  enabled: true
  ide: studio
  autostart: false

# adb model: a single host-side adb-server serves both host and container
# adb-clients, communicating over a Unix socket at ~/.android/adb.sock.
# Configured entirely via the ADB_SERVER_SOCKET env var — same value in
# both places. Works identically for USB, `adb tcpip`, and Android 11+
# wireless debugging.
#
# One-time host setup — add to ~/.bashrc / ~/.zshrc:
#   export ADB_SERVER_SOCKET=localfilesystem:$HOME/.android/adb.sock
#   adb start-server   # idempotent; only starts if not already running
# Then on next login (or `source ~/.bashrc`): adb-server reads
# ADB_SERVER_SOCKET and listens on that Unix socket instead of TCP:5037.
#
# Pair the phone once on the host (`adb pair`, `adb connect`); the
# container inherits the running server with no extra steps.
#
# IMPORTANT: the socket file must exist on host before `jailbee new` /
# `jailbee start` (Incus binds files at container start). If you ever see a mount
# error, just run `adb start-server` on host and retry.

# Repo-specific host bind-mounts.
#
# Android SDK is bind-mounted RO so Gradle can find platforms/build-tools
# without reinstalling them in every container. The host adb-server's
# Unix socket is bind-mounted as a single file at /home/dev/.adb.sock —
# no need to expose ~/.android (adb-client doesn't read adbkey; that's
# only used server-side for authenticating with the phone).
# Personal mounts (~/.gnupg, ~/.gitconfig, JetBrains/Toolbox) belong in
# ~/.config/jailbee/global.yaml.
host_mounts:
  - { host: ~/Android/Sdk,       container: /home/dev/Android/Sdk, readonly: true  }
  - { host: ~/.android/adb.sock, container: /home/dev/.adb.sock,   readonly: false }
  # Socket must live OUTSIDE /run because container-init mounts tmpfs on
  # top of /run after Incus's disk devices are wired, burying any disk
  # mount under /run/*. /home/dev (ext4 rootfs, no overlay) is safe.
  # - { host: ~/.android/adb.sock, container: /home/dev/.adb.sock,   readonly: false }
  # Sibling git repos that are gitignored in the main repo but live
  # under the working tree (ai-local, wiki, readthedocs). All three are
  # mounted RW so edits/commits made inside the container are reflected
  # on the host. jailbee clones the main repo at /home/dev/<repo-root.name>.
  - { host: ai-local,    container: /home/dev/and-bible/ai-local,    readonly: false }
  - { host: wiki,        container: /home/dev/and-bible/wiki,        readonly: false }
  - { host: readthedocs, container: /home/dev/and-bible/readthedocs, readonly: false }

# Persistent shared caches (bind-mounted from <shared_dir>/<host_subpath>).
# The ai-local ostickethelper / playwright tools install Chromium (~150 MB)
# into ~/.cache/ms-playwright, which is NOT bind-mounted by default and lives
# on the container's ephemeral overlay — so it vanishes on every `jailbee new`
# and re-downloads each session. Persisting just ms-playwright (not all of
# ~/.cache) keeps the browser around; jailbee auto-creates the host subpath,
# so no manual mkdir is needed.
shared_caches:
  - { name: cache, host_subpath: home-caches, container_path: ~/.cache }
  # Persist ~/.android so the generated debug.keystore (and thus the debug
  # signing key) stays identical across `jailbee new` sessions. Without this
  # the keystore lives on the ephemeral overlay and is regenerated each session,
  # giving a new signing key every time — so `adb install -r` of a debug build
  # fails with INSTALL_FAILED_UPDATE_INCOMPATIBLE against a previous session's
  # install. A stable key lets debug builds upgrade in place.
  - { name: android-home, host_subpath: android-home, container_path: ~/.android }

# Egress allowlist applied in strict mode. These cover Android Gradle
# builds, npm/Vue.js dependencies, and apt updates. adb-server traffic
# goes over the bind-mounted Unix socket, not the network, so no egress
# rule is needed for it.
# Add github.com only when you actually need to push (or switch to
# `jailbee net loose <name>` for that session).
egress_allow:
  # Android / Google
  - dl.google.com
  - maven.google.com
  - android.googlesource.com
  # Maven Central / Gradle
  - repo.maven.apache.org
  - repo1.maven.org
  - plugins.gradle.org
  - services.gradle.org
  - jitpack.io
  # Node / npm (for app/bibleview-js)
  - registry.npmjs.org
  - registry.yarnpkg.com
  # Ubuntu apt
  - archive.ubuntu.com:443
  - security.ubuntu.com:443
  - ports.ubuntu.com:443
  - github.com:443
  - release-assets.githubusercontent.com:443
  - support.andbible.org:443

# Container resource defaults. Android Gradle builds are memory-hungry;
# the Vue.js side is light, but the JVM + Gradle daemon + Kotlin compiler
# easily eats 8–12 GiB on a full build.
defaults:
  memory: 16GiB
  cpu: 8
  network: strict
  storage_pool: default

# Golden image config. Versions match the repo's documented requirements
# (CLAUDE.md): Java 17, Node 20.
golden:
  ubuntu_version: "26.04"
  java: amazon-corretto-17
  node: 20
  # android-tools-adb gives the container an adb-client; the actual
  # adb-server runs on the host (see adb model comment above).
  extra_apt_packages:
    - android-tools-adb
    # typst is NOT in apt — it's installed from a GitHub release binary by
    # .jailbee/install.d/95-typst.sh (PDF receipt generation for ostickethelper).
    # xz-utils provides the `xz` decompressor that snippet's `tar -xJf` needs.
    - xz-utils

# Autostart left empty — leaving setup decisions to the user.
# Useful starting points if you want to fill this in later:
#   on_create:
#     - name: bibleview-install
#       run: "npm install"
#       working_dir: app/bibleview-js
#       network: loose
# Container-wide env vars injected via the Incus base profile — visible
# in every process Incus spawns (jailbee shell, jailbee tmux, autostart steps,
# the IDE). ADB_SERVER_SOCKET points at the host adb-server's Unix
# socket bind-mounted under ~/.android. ANDROID_HOME / ANDROID_SDK_ROOT
# let the Android SDK be discovered from the RO-mounted host SDK.
container:
  env:
    ADB_SERVER_SOCKET: "localfilesystem:/home/dev/.adb.sock"
    ANDROID_HOME: /home/dev/Android/Sdk
    ANDROID_SDK_ROOT: /home/dev/Android/Sdk

autostart:
  step_timeout: 600
  on_create: []
  on_start: []
