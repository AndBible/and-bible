name: iOS tests
on:
  workflow_dispatch:
  push:
    branches: [ios]
    paths:
      - "sharedUi/**"
      - "sharedCore/**"
      - "sharedData/**"
      - "sharedLogic/**"
      - "app/bibleview-js/**"
      - "gradle/libs.versions.toml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "strings-gen/**"
      - "jsword"
      - "kdom"
      - "app/src/main/res/values/strings.xml"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "sharedUi/**"
      - "sharedCore/**"
      - "sharedData/**"
      - "sharedLogic/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "strings-gen/**"
      - "jsword"
      - "kdom"
      - "app/src/main/res/values/strings.xml"
      - ".github/workflows/ios.yml"
concurrency: {group: "ios-${{ github.ref }}", cancel-in-progress: true}
jobs:
  jsword-ios-tests:
    runs-on: macos-15
    # 23-36 min on green runs; run 41981288468 hit the old 45 min limit in its last (sharedLogic) step.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Init jsword and kdom submodules
        run: git submodule update --init jsword kdom
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app
      - name: jsword common tests on the iOS simulator
        run: ./gradlew -Dorg.gradle.native=false :jsword:iosSimulatorArm64Test
      - name: kdom common tests on the iOS simulator
        run: ./gradlew -Dorg.gradle.native=false :kdom:iosSimulatorArm64Test
      - name: Boot a simulator for the sharedCore iOS tests
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; n=sys.argv[1]; print(next(d['udid'] for rt in json.load(sys.stdin)['devices'].values() for d in rt if d['name']==n))" "iPhone 16")
          xcrun simctl bootstatus "$UDID" -b
          echo "IOS_TEST_SIMULATOR=$UDID" >> "$GITHUB_ENV"
      - name: sharedCore common and iOS tests on the iOS simulator
        timeout-minutes: 20
        run: ./gradlew -Dorg.gradle.native=false :sharedCore:iosSimulatorArm64Test
      - name: sharedData common tests on the iOS simulator
        run: ./gradlew -Dorg.gradle.native=false :sharedData:iosSimulatorArm64Test
      - name: sharedLogic common tests on the iOS simulator
        run: ./gradlew -Dorg.gradle.native=false :sharedLogic:iosSimulatorArm64Test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jsword-ios-tests
          path: |
            jsword/build/reports/tests/iosSimulatorArm64Test
            kdom/build/reports/tests/iosSimulatorArm64Test
            sharedCore/build/reports/tests/iosSimulatorArm64Test
            sharedData/build/reports/tests/iosSimulatorArm64Test
            sharedLogic/build/reports/tests/iosSimulatorArm64Test
  webkit-shim:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/bibleview-js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: npm ci
      - run: npx playwright install webkit
      - run: npm run build-production
      - run: npm run test:ios-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-shim-screenshot
          path: app/bibleview-js/ios/webkit/last-run.png
          if-no-files-found: ignore
