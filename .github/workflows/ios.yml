name: iOS PoC
on:
  workflow_dispatch:
  push:
    branches: [ios]
    paths:
      - "sharedUi/**"
      - "sharedCore/**"
      - "sharedData/**"
      - "sharedLogic/**"
      - "iosApp/**"
      - "app/bibleview-js/**"
      - "gradle/libs.versions.toml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "strings-gen/**"
      - "jsword"
      - "kdom"
      - "app/src/main/res/values/strings.xml"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "sharedUi/**"
      - "sharedCore/**"
      - "sharedData/**"
      - "sharedLogic/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "strings-gen/**"
      - "jsword"
      - "kdom"
      - "app/src/main/res/values/strings.xml"
      - ".github/workflows/ios.yml"
concurrency: {group: "ios-${{ github.ref }}", cancel-in-progress: true}
jobs:
  jsword-ios-tests:
    runs-on: macos-15
    # 23-36 min on green runs; run 41981288468 hit the old 45 min limit in its last (sharedLogic) step.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Init jsword and kdom submodules
        run: git submodule update --init jsword kdom
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app
      - name: jsword common tests on the iOS simulator
        run: ./gradlew -Dorg.gradle.native=false :jsword:iosSimulatorArm64Test
      - name: kdom common tests on the iOS simulator
        run: ./gradlew -Dorg.gradle.native=false :kdom:iosSimulatorArm64Test
      - name: Boot a simulator for the sharedCore iOS tests
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; n=sys.argv[1]; print(next(d['udid'] for rt in json.load(sys.stdin)['devices'].values() for d in rt if d['name']==n))" "iPhone 16")
          xcrun simctl bootstatus "$UDID" -b
          echo "IOS_TEST_SIMULATOR=$UDID" >> "$GITHUB_ENV"
      - name: sharedCore common and iOS tests on the iOS simulator
        timeout-minutes: 20
        run: ./gradlew -Dorg.gradle.native=false :sharedCore:iosSimulatorArm64Test
      - name: sharedData common tests on the iOS simulator
        run: ./gradlew -Dorg.gradle.native=false :sharedData:iosSimulatorArm64Test
      - name: sharedLogic common tests on the iOS simulator
        run: ./gradlew -Dorg.gradle.native=false :sharedLogic:iosSimulatorArm64Test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jsword-ios-tests
          path: |
            jsword/build/reports/tests/iosSimulatorArm64Test
            kdom/build/reports/tests/iosSimulatorArm64Test
            sharedCore/build/reports/tests/iosSimulatorArm64Test
            sharedData/build/reports/tests/iosSimulatorArm64Test
            sharedLogic/build/reports/tests/iosSimulatorArm64Test
  ios:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # settings.gradle.kts includes :jsword and the kdom composite build (submodules), so the Gradle build needs them. Only those: the
      # golden-screenshot and website-media submodules are unused here, and docs/superpowers is private (update=none).
      - name: Init jsword and kdom submodules
        run: git submodule update --init jsword kdom
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      # Kotlin 2.3.20-2.3.21 pairs with Xcode 26.0 (KMP compatibility guide); newest 26.0.x on macos-15 is 26.0.1.
      # NOTE: that pairing came from a search summary of the guide and is unverified against the page itself.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.0.1.app
      - name: Gradle JVM args for the Xcode pre-build framework task
        # Keep the project's other JVM flags; only raise the heap (replace the -Xmx value in place).
        run: |
          sed -i.bak -E 's/-Xmx[0-9]+[gGmM]/-Xmx6g/' gradle.properties
          grep -n "org.gradle.jvmargs" gradle.properties
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build bibleview-js
        working-directory: app/bibleview-js
        run: npm ci && npm run build-production
      - name: Generate Xcode project
        run: |
          scripts/ios-version-xcconfig.sh
          cd iosApp
          xcodegen generate
      # The UI tests that need an installed KJV install it from the debug bundle's h2-kjv.zip through the production
      # incoming queue (KjvProvisioning.swift); generate-files-test-fixtures.py bundles tmp/h2-files/h2-kjv.zip when it
      # exists. KJV is not in the repository: package it from the same encrypted test modules the Android unit tests use
      # (run-tests.yml), exactly as scripts/mac-remote.sh does from ~/.sword on the Mac. Without it (e.g. secrets not
      # available) the tests fall back to the Files picker and fail with a HARNESS message naming the missing fixture.
      - name: Restore test modules cache
        id: cache-test-modules
        uses: actions/cache@v4
        with:
          path: ~/.sword
          key: ${{ runner.os }}-test-modules
      - name: Download test modules if not cached
        if: steps.cache-test-modules.outputs.cache-hit != 'true'
        env:
          URL: ${{ secrets.DOWNLOAD_TEST_MODULES_URL }}
          KEY: ${{ secrets.TEST_MODULE_ENCRYPTION_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "::warning::test module secrets unavailable: no bundled KJV"; exit 0; fi
          curl -fsSL --retry 3 "$URL" -o "$RUNNER_TEMP/testmods.zip.enc"
          openssl aes-256-cbc -d -a -pbkdf2 -in "$RUNNER_TEMP/testmods.zip.enc" -out "$RUNNER_TEMP/testmods.zip" -pass "pass:$KEY"
          mkdir -p "$HOME/.sword"
          unzip -q -o -d "$HOME/.sword" "$RUNNER_TEMP/testmods.zip"
          rm -f "$RUNNER_TEMP/testmods.zip" "$RUNNER_TEMP/testmods.zip.enc"
      - name: Package the KJV UI-test fixture
        run: |
          if [ -f "$HOME/.sword/mods.d/kjv.conf" ]; then
            mkdir -p tmp/h2-files
            python3 -I iosApp/scripts/package-backup-test-kjv.py --sword-dir "$HOME/.sword" --output tmp/h2-files/h2-kjv.zip
            ls -l tmp/h2-files/h2-kjv.zip
          else
            echo "::warning::no KJV test module: the UI tests fall back to the Files picker install"
          fi
      - name: List available simulators (diagnostic)
        if: always()
        run: xcrun simctl list devices available
      - name: Test (iPhone, UI smoke set)
        # A step timeout well inside the job's 90 min, so a hang still reaches the artifact upload below (a job timeout
        # skips it: the timed-out runs since 2026-10-20 left no log and no xcresult).
        timeout-minutes: 50
        run: |
          mkdir -p build
          set -o pipefail
          # Under XCUITest the app is a separate process: its NSLog output (I0-WEBVIEW-TERMINATED, js[..] errors,
          # bridge: logs) never reaches xcodebuild's stdout. Boot the destination first so `log stream` can attach
          # to that simulator, and stream the app's unified log to a file for the duration of the run.
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; n=sys.argv[1]; print(next(d['udid'] for rt in json.load(sys.stdin)['devices'].values() for d in rt if d['name']==n))" "iPhone 16")
          xcrun simctl bootstatus "$UDID" -b || true
          # Same Files-provider preparation as scripts/mac-remote.sh xcode-test (H2 Fixtures for the picker tests and
          # the picker fallback of the KJV provisioning).
          bash iosApp/scripts/prepare-ui-test-files.sh "$UDID"
          nohup xcrun simctl spawn "$UDID" log stream --style compact --predicate 'process == "AndBibleDev" AND subsystem != "com.apple.dt.xctest"' > build/app-iphone.log 2>&1 &
          echo $! > build/logstream-iphone.pid
          sleep 2
          # The full UI suite (~110 tests, over an hour) runs on the Mac at batch ends (scripts/mac-remote.sh xcode-test);
          # CI runs the unit tests plus the UI smoke set (iosApp/iosAppUITests/smoke-tests.txt, issue #3949).
          SMOKE=()
          while IFS= read -r line; do
            line="${line%%#*}"; line="${line//[[:space:]]/}"
            [ -n "$line" ] && SMOKE+=("-only-testing:iosAppUITests/$line")
          done < iosApp/iosAppUITests/smoke-tests.txt
          xcodebuild test -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:iosAppUnitTests "${SMOKE[@]}" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 600 -maximum-test-execution-time-allowance 900 \
            -resultBundlePath build/ios-iphone.xcresult | tee build/xcodebuild-iphone.log
      - name: Stop app log stream (iphone)
        if: always()
        run: |
          sleep 2
          [ -f build/logstream-iphone.pid ] && kill "$(cat build/logstream-iphone.pid)" || true
      - name: Test (iPad, screenshots only)
        if: always()
        timeout-minutes: 20
        run: |
          mkdir -p build
          set -o pipefail
          # Under XCUITest the app is a separate process: its NSLog output (I0-WEBVIEW-TERMINATED, js[..] errors,
          # bridge: logs) never reaches xcodebuild's stdout. Boot the destination first so `log stream` can attach
          # to that simulator, and stream the app's unified log to a file for the duration of the run.
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; n=sys.argv[1]; print(next(d['udid'] for rt in json.load(sys.stdin)['devices'].values() for d in rt if d['name']==n))" "iPad Air 11-inch (M2)")
          xcrun simctl bootstatus "$UDID" -b || true
          nohup xcrun simctl spawn "$UDID" log stream --style compact --predicate 'process == "AndBibleDev" AND subsystem != "com.apple.dt.xctest"' > build/app-ipad.log 2>&1 &
          echo $! > build/logstream-ipad.pid
          sleep 2
          xcodebuild test -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:iosAppUITests/PocUITests/testScreenshotsAllScenarios \
            -resultBundlePath build/ios-ipad.xcresult | tee build/xcodebuild-ipad.log
      - name: Stop app log stream (ipad)
        if: always()
        run: |
          sleep 2
          [ -f build/logstream-ipad.pid ] && kill "$(cat build/logstream-ipad.pid)" || true
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p build/screenshots
          for r in build/ios-iphone.xcresult build/ios-ipad.xcresult; do
            [ -d "$r" ] && xcrun xcresulttool export attachments --path "$r" --output-path "build/screenshots/$(basename $r .xcresult)" || true
          done
      - name: App log summary
        if: always()
        run: |
          for f in build/app-*.log; do
            [ -f "$f" ] || continue
            echo "$f: lines=$(wc -l < "$f")"
            echo "  I0-WEBVIEW-TERMINATED: $(grep -c 'I0-WEBVIEW-TERMINATED' "$f" || true)"
            echo "  js[ error lines: $(grep -c 'js\[' "$f" || true)"
            grep 'js\[' "$f" | head -20 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-poc-results
          path: |
            build/*.xcresult
            build/screenshots
            build/xcodebuild-*.log
            build/app-*.log
  webkit-shim:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app/bibleview-js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - run: npm ci
      - run: npx playwright install webkit
      - run: npm run build-production
      - run: npm run test:ios-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-shim-screenshot
          path: app/bibleview-js/ios/webkit/last-run.png
          if-no-files-found: ignore
