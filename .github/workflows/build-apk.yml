name: Build APK when adding tag

on:
  push:
    tags:
      - 'test-*'
      - 'alpha-*'
      - 'beta-*'
      - 'production-*'


permissions:
  contents: write

jobs:
  build:
    environment: And Bible Builds
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 10 # so that recent tags can be found
        submodules: recursive

    - name: Initialize jsword submodule with shallow clone
      run: |
        git submodule update --init --depth=1
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Node.js environment
      uses: actions/setup-node@v3
      with:
        # Version Spec of the version to use.  Examples: 10.x, 10.15.1, >=10.15.0
        node-version: '24'

    - name: Cache gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
          ~/.android/build-cache
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
        restore-keys: ${{ runner.os }}-gradle-

    # The suffix is a Gradle property (-PversionNameSuffix), see version.properties and app/build.gradle.kts.
    # GRADLE_VERSION_ARGS reaches the build step, VERSION_SUFFIX the VNAME file below.
    - name: Check/set alpha version suffix
      if: contains(github.ref, 'refs/tags/alpha-')
      run: |
        echo "VERSION_SUFFIX=-alpha" >> $GITHUB_ENV
        echo "GRADLE_VERSION_ARGS=-PversionNameSuffix=-alpha" >> $GITHUB_ENV

#    - name: Check/set beta version suffix
#      if: contains(github.ref, 'refs/tags/beta-')
#      run: |
#        echo "VERSION_SUFFIX=-beta" >> $GITHUB_ENV
#        echo "GRADLE_VERSION_ARGS=-PversionNameSuffix=-beta" >> $GITHUB_ENV

    - name: Get variables
      id: tag_name
      run: |
        . scripts/lib-version.sh
        echo TAG=${GITHUB_REF#refs/tags/} >> $GITHUB_OUTPUT
        if [[ -n "$VERSION_SUFFIX" ]]; then version_name "$VERSION_SUFFIX" > VNAME; else version_name > VNAME; fi
        echo VERSION_NAME=$(cat VNAME) >> $GITHUB_OUTPUT
        echo RELEASE_TITLE=$( if [[ $GITHUB_REF =~ test- ]]; then echo "Test release $(cat VNAME)"; elif [[ $GITHUB_REF =~ beta- ]]; then echo "Beta release $(cat VNAME)"; else echo "Release $(cat VNAME)"; fi ) >> $GITHUB_OUTPUT
        # Changelog filenames use the versionCode (fastlane/F-Droid convention),
        # e.g. 1099.txt, not the versionName 5.1.1099.txt.
        VCODE=$(version_code)
        echo "./fastlane/metadata/android/en-US/changelogs/${VCODE}.txt" > CLPATH
        if [[ -f $(cat CLPATH) ]]; then cp $(cat CLPATH) RELEASENOTES.txt; else cat > ./RELEASENOTES.txt; fi

    - name: Build with Gradle
      run: ./gradlew --console plain $GRADLE_VERSION_ARGS assembleStandardGithubRelease assembleDiscreteGithubRelease

    - name: Sign apks
      if: contains(github.ref, 'refs/tags/')
      env: 
        TAG_NAME: ${{ steps.tag_name.outputs.TAG }}
      run: |
        echo ${{ secrets.KEYSTORE_BASE64 }} | base64 --decode > keystore.jks
        $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign --ks keystore.jks --ks-pass 'pass:${{ secrets.KEYSTORE_PASSPHRASE }}' --key-pass 'pass:${{ secrets.KEY_PASSPHRASE }}' --out $GITHUB_WORKSPACE/andbible-$TAG_NAME.apk app/build/outputs/apk/standardGithub/release/*-unsigned.apk
        $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner sign --ks keystore.jks --ks-pass 'pass:${{ secrets.KEYSTORE_PASSPHRASE }}' --key-pass 'pass:${{ secrets.KEY_PASSPHRASE }}' --out $GITHUB_WORKSPACE/calculator-$TAG_NAME.apk app/build/outputs/apk/discreteGithub/release/*-unsigned.apk
        rm -f keystore.jks
    # Releases are immutable: assets can only be added while the release is a draft. Always create a
    # draft. test-/beta-/production- tags also get desktop packages: the Desktop workflow's release-assets
    # job uploads them and publishes the draft. Other tags (alpha-) are published right here.
    - name: Create draft release
      if: contains(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v3
      env:
        TAG_NAME: ${{ steps.tag_name.outputs.TAG }}
        RELEASE_TITLE: ${{ steps.tag_name.outputs.RELEASE_TITLE }}
      with:
        tag_name: ${{ env.TAG_NAME }}
        name: ${{ env.RELEASE_TITLE }}
        body_path: ./RELEASENOTES.txt
        prerelease: true
        draft: true
        fail_on_unmatched_files: true
        files: |
          ./andbible-${{ env.TAG_NAME }}.apk
          ./calculator-${{ env.TAG_NAME }}.apk

    - name: Publish release (tags without desktop packages)
      if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref_name, 'test-') && !startsWith(github.ref_name, 'beta-') && !startsWith(github.ref_name, 'production-')
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG_NAME: ${{ steps.tag_name.outputs.TAG }}
      run: gh release edit "$TAG_NAME" --draft=false

    - name: Before saving cache
      run: |
        rm -f  $HOME/.gradle/caches/modules-2/modules-2.lock
        rm -fr $HOME/.gradle/caches/*/plugin-resolution/
