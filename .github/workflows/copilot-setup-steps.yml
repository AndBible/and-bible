name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    
    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      contents: read
    
    steps:
      # Core repository setup
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 10
          submodules: recursive

      - name: Initialize jsword submodule with shallow clone
        run: |
          git submodule update --init --depth=1

      # Java 17 setup for Android development
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      
      # Node.js 24 setup for Vue.js development
      - name: Set up Node.js 24
        uses: actions/setup-node@v3
        with:
          node-version: '24'
      
      # Upgrade npm to latest version
      - name: Upgrade npm
        run: npm install -g npm
      
      # Install Vue.js dependencies
      - name: Install Vue.js dependencies
        working-directory: app/bibleview-js
        run: npm ci
      
      # Cache Gradle dependencies for Android builds
      - name: Cache gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-