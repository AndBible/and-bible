name: Desktop
on:
  workflow_dispatch:
  push:
    tags: ["test-*", "production-*"]
    paths:
      - "desktopApp/**"
      - "sharedUi/**"
      - "sharedLogic/**"
      - "sharedCore/**"
      - "sharedData/**"
      - "jsword/**"
      - "app/bibleview-js/**"
      - "version.properties"
      - "gradle/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktopApp/**"
      - "sharedUi/**"
      - "sharedLogic/**"
      - "sharedCore/**"
      - "sharedData/**"
      - "jsword/**"
      - "app/bibleview-js/**"
      - "version.properties"
      - "gradle/**"
      - ".github/workflows/desktop.yml"
permissions: {contents: read}
concurrency: {group: "desktop-${{ github.ref }}", cancel-in-progress: true}
jobs:
  linux-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Initialize public submodules
        run: git submodule update --init jsword kdom
      # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: "17"}
      # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/bibleview-js/package-lock.json
      # v4 (gradle/actions, annotated tag, commit SHA)
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      # The CEF natives archive; keep the tag in step with kcefJbrTag in desktopApp/build.gradle.kts.
      # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: desktopApp/build/kcef-download
          key: kcef-natives-jbr-release-17.0.14b1367.22
      - name: Desktop tests and Linux packages
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          kind=dev
          if [[ "$REF_TYPE" == tag && "$REF_NAME" == test-* ]]; then kind=test; fi
          if [[ "$REF_TYPE" == tag && "$REF_NAME" == production-* ]]; then kind=production; fi
          ./gradlew "-PdesktopReleaseKind=$kind" :desktopApp:test :desktopApp:packageDeb :desktopApp:desktopTarball :desktopApp:packageAppImage
      # v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: andbible-desktop-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error
          retention-days: 14
      # v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: andbible-desktop-tarball
          path: desktopApp/build/compose/binaries/main/*.tar.gz
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: andbible-desktop-appimage
          path: desktopApp/build/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
  flatpak:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Pin CI manifest to this commit
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, re
          sha = os.environ['SOURCE_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', sha)
          path = pathlib.Path('packaging/flatpak/org.andbible.AndBible.yml')
          text = path.read_text()
          pattern = r'url: https://github\.com/AndBible/and-bible\.git\n(\s+)commit: [0-9a-f]+'
          url = pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve().as_uri()
          text, count = re.subn(pattern, lambda m: f'url: {url}\n{m.group(1)}commit: {sha}', text)
          assert count == 1, 'Expected exactly one application source'
          path.with_name('ci-manifest.yml').write_text(text)
          PYCODE
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3
        with:
          manifest-path: packaging/flatpak/ci-manifest.yml
          bundle: andbible.flatpak
          artifact-name: andbible-flatpak
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Initialize public submodules
        run: git submodule update --init jsword kdom
      # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: "17"}
      # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/bibleview-js/package-lock.json
      # v4
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Build BibleView
        working-directory: app/bibleview-js
        run: npm ci && npm run build-production
      - name: Ensure Windows packaging tools
        shell: pwsh
        run: |
          $wix = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (-not ((Test-Path "$wix\candle.exe") -and (Test-Path "$wix\light.exe"))) {
            choco install wixtoolset --version=3.14.1 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "WiX installation failed" }
          }
          if (-not ((Test-Path "$wix\candle.exe") -and (Test-Path "$wix\light.exe"))) { throw "WiX 3.14 tools not found" }
          $wix | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          if (-not (Get-ChildItem "$sdkBin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue)) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vs = & $vswhere -latest -products * -property installationPath
            if (-not $vs) { throw "Visual Studio installation not found" }
            $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
            $process = Start-Process -FilePath $installer -ArgumentList @('modify', '--installPath', "`"$vs`"", '--add', 'Microsoft.VisualStudio.Component.Windows10SDK.19041', '--quiet', '--wait', '--norestart') -Wait -PassThru
            if ($process.ExitCode -notin @(0, 3010)) { throw "Windows SDK installation failed: $($process.ExitCode)" }
          }
          if (-not (Get-ChildItem "$sdkBin\*\x64\makeappx.exe" -ErrorAction SilentlyContinue)) { throw "Windows SDK MakeAppx not found" }
      - name: Build Windows packages
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          CERT_BASE64: ${{ secrets.ANDBIBLE_WIN_CERT }}
          ANDBIBLE_WIN_CERT_PASSWORD: ${{ secrets.ANDBIBLE_WIN_CERT_PASSWORD }}
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP 'andbible-signing.pfx'
          try {
            if ($env:CERT_BASE64) {
              [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:CERT_BASE64))
              $env:ANDBIBLE_WIN_CERT = $certPath
            }
            $kind = 'dev'
            if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -like 'test-*') { $kind = 'test' }
            if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -like 'production-*') { $kind = 'production' }
            .\gradlew.bat "-PdesktopReleaseKind=$kind" :desktopApp:packageWindowsZip :desktopApp:packageWindowsMsix :desktopApp:packageWindowsMsi
            if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed" }
            foreach ($extension in @('zip', 'msix', 'msi')) {
              $files = @(Get-ChildItem "desktopApp/build/compose/binaries/main/andbible-*-windows-x64.$extension")
              if ($files.Count -ne 1) { throw "Expected exactly one Windows $extension artifact" }
            }
          } finally {
            if (Test-Path -LiteralPath $certPath) {
              Remove-Item -LiteralPath $certPath -Force -ErrorAction Stop
              if (Test-Path -LiteralPath $certPath) { throw "Signing certificate cleanup failed" }
            }
          }
      - name: Smoke test app image
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem desktopApp/build/compose/binaries/main/andbible-*-windows-x64.zip)
          if ($zip.Count -ne 1) { throw "Expected exactly one Windows zip" }
          & ./desktopApp/scripts/smoke-windows.ps1 -Zip $zip[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "Windows smoke failed" }
      # v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: andbible-desktop-windows-x64
          path: |
            desktopApp/build/compose/binaries/main/andbible-*-windows-x64.zip
            desktopApp/build/compose/binaries/main/andbible-*-windows-x64.msix
            desktopApp/build/compose/binaries/main/andbible-*-windows-x64.msi
          if-no-files-found: error
          retention-days: 14

  release-assets:
    if: github.ref_type == 'tag' && (startsWith(github.ref_name, 'test-') || startsWith(github.ref_name, 'production-'))
    needs: [linux-packages, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
      - name: Validate and upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          copy_one() {
            local dir="$1" pattern="$2" dest="$3"
            local -a files
            mapfile -d '' files < <(find "artifacts/$dir" -maxdepth 1 -type f -name "$pattern" -print0)
            if (( ${#files[@]} != 1 )); then printf 'Expected exactly one %s in %s; got %s\n' "$pattern" "$dir" "${#files[@]}" >&2; exit 1; fi
            cp -- "${files[0]}" "release/$dest"
          }
          copy_one andbible-desktop-deb '*.deb' "andbible-desktop-$TAG-amd64.deb"
          copy_one andbible-desktop-appimage '*.AppImage' "andbible-desktop-$TAG-x86_64.AppImage"
          copy_one andbible-desktop-tarball '*.tar.gz' "andbible-desktop-$TAG-linux-x64.tar.gz"
          copy_one andbible-desktop-windows-x64 '*.msi' "andbible-desktop-$TAG-x64.msi"
          deadline=$((SECONDS + 1800))
          until gh release view "$TAG" >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then printf 'Release was not created within 30 minutes\n' >&2; exit 1; fi
            sleep 60
          done
          gh release upload "$TAG" release/* --clobber
