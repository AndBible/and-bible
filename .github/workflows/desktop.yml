name: Desktop
on:
  workflow_dispatch:
  push:
    paths:
      - "desktopApp/**"
      - "sharedUi/**"
      - "sharedLogic/**"
      - "sharedCore/**"
      - "sharedData/**"
      - "jsword/**"
      - "app/bibleview-js/**"
      - "version.properties"
      - "gradle/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktopApp/**"
      - "sharedUi/**"
      - "sharedLogic/**"
      - "sharedCore/**"
      - "sharedData/**"
      - "jsword/**"
      - "app/bibleview-js/**"
      - "version.properties"
      - "gradle/**"
      - ".github/workflows/desktop.yml"
concurrency: {group: "desktop-${{ github.ref }}", cancel-in-progress: true}
jobs:
  linux-packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with: {distribution: temurin, java-version: "17"}
      # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/bibleview-js/package-lock.json
      # v4 (gradle/actions, annotated tag, commit SHA)
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      # The CEF natives archive; keep the tag in step with kcefJbrTag in desktopApp/build.gradle.kts.
      # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: desktopApp/build/kcef-download
          key: kcef-natives-jbr-release-17.0.14b1367.22
      - name: Desktop tests and Linux packages
        run: ./gradlew :desktopApp:test :desktopApp:packageDeb :desktopApp:desktopTarball
      # v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: andbible-desktop-deb
          path: desktopApp/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error
          retention-days: 14
      # v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: andbible-desktop-tarball
          path: desktopApp/build/compose/binaries/main/*.tar.gz
          if-no-files-found: error
          retention-days: 14
