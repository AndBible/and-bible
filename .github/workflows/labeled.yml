name: Assign to projects based on labeling

on:
  issues:
    types:
      - opened
  pull_request:
    types:
      - opened

jobs:
  add-to-project:
    name: Add issue to project
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to project
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) && secrets.PROJECT_ACCESS_TOKEN != '' }}
        uses: actions/add-to-project@v0.3.0
        with:
          project-url: https://github.com/orgs/AndBible/projects/7
          github-token: ${{ secrets.PROJECT_ACCESS_TOKEN }}
          labeled: 'Type: Discussion'
