name: "AndBible Development Environment Setup"

# GitHub Actions workflow for setting up AndBible development environment
# Used by GitHub Copilot Coding Agent to prepare virtual environment
# Based on: https://docs.github.com/en/enterprise-cloud@latest/copilot/how-tos/use-copilot-agents/coding-agent/customize-the-agent-environment

on: [push, pull_request]

jobs:
  setup:
    runs-on: ubuntu-24.04
    
    steps:
      # Core repository setup
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 10
      
      # Java 17 setup for Android development
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      
      # Node.js 20 setup for Vue.js development
      - name: Set up Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      
      # Upgrade npm to latest version
      - name: Upgrade npm
        run: npm install -g npm
      
      # Install Vue.js dependencies
      - name: Install Vue.js dependencies
        working-directory: app/bibleview-js
        run: npm ci
      
      # Cache Gradle dependencies for Android builds
      - name: Cache gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-
      
      # Verify environment setup
      - name: Verify Java version
        run: java --version
      
      - name: Verify Node.js version
        run: node --version
      
      - name: Verify npm version
        run: npm --version
      
      # Run Vue.js validation (fast feedback)
      - name: Run Vue.js tests
        working-directory: app/bibleview-js
        run: npm run test:ci
      
      - name: Run Vue.js linting
        working-directory: app/bibleview-js
        run: npm run lint:ci
      
      - name: Run Vue.js type checking
        working-directory: app/bibleview-js
        run: npm run type-check:ci
      
      # Build Vue.js components
      - name: Build Vue.js debug version
        working-directory: app/bibleview-js
        run: npm run build-debug
      
      # Validate Gradle setup (without full build)
      - name: Validate Gradle wrapper
        run: ./gradlew --version
      
      # Clean up cache before saving
      - name: Clean Gradle cache
        if: always()
        run: |
          rm -f  $HOME/.gradle/caches/modules-2/modules-2.lock
          rm -fr $HOME/.gradle/caches/*/plugin-resolution/