# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "AndBible: Bible Study"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "Účinné štúdium Biblie: komentáre, záložky, poznámky, AI nástroje"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: Účinný nástroj na štúdium Biblie
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  „{{ title }}" je výkonná, ľahko použiteľná offline aplikácia na štúdium Biblie pre Android — všestranný nástroj s kvalitnými funkciami pre rôzne spôsoby štúdia, od príležitostného čítania až po hlboký výskum. Nie je to iba čítačka, ale nástroj na skutočne vážne osobné štúdium.
paragraph_1_2: >
  Vyvinuté čitateľmi Biblie pre čitateľov Biblie — neziskový komunitný projekt s otvoreným kódom, ktorý je úplne zadarmo a neobsahuje žiadne reklamy.
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >
  Niekoľko populárnych verzií Biblie (z mnohých dostupných) je KJV, NASB, NET a tiež obľúbené komentáre ako Matthew Henry a John Gill.
subtitle_2: Výkonné funkcie pre štúdium Biblie
paragraph_2_1: >
  Aplikácia má mnoho podnetných a originálnych funkcií, vďaka ktorým je komplexná a hlboká skúsenosť so štúdiom Biblie hladšia ako kedykoľvek predtým. Najvýznamnejšie funkcie sú nasledujúce:
feature_01: "Oddelené zobrazenia textu, ktoré umožňujú porovnávať preklady a konzultovať komentáre\n"
feature_02: Pracovné prostredia umožňujúce vlastné nastavenia pre štúdium Biblie
feature_03: Integrácia Strongových čísel umožňuje rozbor gréckych a hebrejských slov
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  Klepnutím na ľubovoľný odkaz zobrazíte prepojené krížové odkazy, poznámky pod čiarou a komentáre ({{commentary_examples}}) alebo zbierky krížových odkazov ({{cross_reference_examples}}).
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: "Gill, Matthew Henry atď."
# Examples of cross-reference collections.
cross_reference_examples: "Konkordancia Treasure of Scripture Knowledge, TSKe"
feature_05: Pokročilé čítanie so záložkami umožňujúcimi plynulé počúvanie Biblie
feature_06: "Flexibilné fulltextové vyhľadávanie v jednom alebo vo viacerých prekladoch Biblie súčasne\n"
feature_07: Pokročilý systém záložiek a zvýraznenia textu s osobnými poznámkami.
feature_08: >
  Synchronizácia medzi zariadeniami: udržujte svoje pracovné plochy, záložky, poznámky a postup čítania zosynchronizované na všetkých svojich zariadeniach
feature_09: >
  Sledovanie čítania a memorovania: nastavte si ciele čítania, sledujte postup a memorujte verše pomocou interaktívnych režimov Pomiešané slová, Poradie slov, Rozmazané slová a Napíš to
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  Rozsiahla knižnica dokumentov: preklady Biblie, teologické komentáre, slovníky, mapy a kresťanské knihy v celkovom počte viac ako {{total_documents}} dokumentov vo viac ako {{total_languages}} jazykoch, legálne distribuované spoločnosťou Crosswire a inými archívmi SWORD.
feature_10_1: >
  Natívna podpora súborov MyBible, MySword a EPUB vám umožní rozšíriť vašu knižnicu ešte viac.
feature_11: >
  Voliteľný AI študijný asistent (iba po vlastnej aktivácii — vyžaduje váš vlastný API kľúč k externej službe): preskúmavajte svoje nainštalované komentáre a slovníky s pomocou AI vo zvolenom jazyku, plus ďalšie tvorivé postupy štúdia. Vstavaný systém oprávnení vám zachováva plnú kontrolu nad tým, čo môže asistent robiť.
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: "ESV, NIV a NKJV"
feature_12: >-
  Offline: internet potrebujete iba na stiahnutie dokumentov.
# UNUSED
feature_13: >
  Študijné zložky pre pridávanie poznámok a referencií na Bibliu pri počúvaní kázní.
subtitle_3: Urobme spolu najlepšiu aplikáciu pre Bibliu!
paragraph_3_1: >
  AndBible je komunitný projekt s otvoreným kódom. V praxi to znamená, že ktokoľvek s vhodnými zručnosťami môže prispieť (povzbudzujeme k tomu) k projektu:
contr_1: vyvinie nové vlastnosti/funkcie
contr_2: "testovaním ešte nezverejnených vlastností,"
contr_3: "udržiavaním aktuálneho prekladu používateľského rozhrania, a"
contr_4: "pomocou pri rozširovaní knižnice modulov získavaním povolení od držiteľov autorských práv alebo konvertovaní dokumentov do formátu SWORD.\n"
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
paragraph_4_1: "Ak ste profesionálny softvérový inžinier alebo tester, zvážte zapojenie sa do projektu. Ďalšie informácie o tom, ako prispieť, nájdete na stránke {{how_to_contribute_url}}.\n"
