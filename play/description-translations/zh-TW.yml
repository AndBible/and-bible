# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "AndBible: 研經工具"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "強大的研經工具：註釋、書籤、筆記、AI 工具一應俱全"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: 功能強大的研經工具
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  「{{ title }}」是一款功能強大、易於使用的離線 Android 研經程式——多元化的高品質工具集，能滿足不同的研經風格，從輕鬆閱讀到深入研究均適用。它不僅是一個閱讀器，更是認真個人研經的得力工具。
paragraph_1_2: >-
  由聖經讀者為聖經讀者所開發——這是一個非牟利、開源的社群計劃，完全免費且不含任何廣告。
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >-
  熱門的聖經譯本如和合本、新譯本、KJV、NASB，以及常見的註解如Matthew Henry及John Gill等。文件之多，未能盡錄。
subtitle_2: 強大的研經功能
paragraph_2_1: >-
  此程式具有原創、有深度的功能，幫助讀者有一個流暢的研經體驗。以下是一些重點的功能：
feature_01: 分割視窗可以幫助比較譯本及參考註解
feature_02: 工作區可以自定研經的環境
feature_03: Strong's 參考方便查找希臘文及希伯來文分析
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  輕點任何連結即可跟隨超連結的交叉參考、注腳和註釋（{{commentary_examples}}）或交叉參考集（{{cross_reference_examples}}）。
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: Gill、Matthew Henry之類
# Examples of cross-reference collections.
cross_reference_examples: "Treasure of Scripture Knowledge, TSKe"
feature_05: 進階的文字轉語音功能及語音書籤，以提供一個流暢的聆聽聖經體驗。
feature_06: 靈活的全文搜尋功能，可同時於一個或多個聖經譯本中搜尋
feature_07: 包括個人筆記的書籤及醒目提示
feature_08: >-
  跨裝置同步：讓你的工作區、書籤、筆記及閱讀進度於所有裝置間保持同步
feature_09: >-
  閱讀及記憶追蹤：設定閱讀目標、追蹤進度，並透過互動式的「打亂單字」、「排列單字」、「模糊單字」及「輸入單字」模式記憶經文
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  龐大的文件庫：{{total_languages}}種語言、超過{{total_documents}}份聖經譯本、神學註釋、字典、地點及基督教書籍。全部均由Crosswire及其他SWORD資料庫授權分發。
feature_10_1: >-
  原生支援MyBible、MySword及EPUB檔案，讓你可以豐富你的收藏。
feature_11: >
  可選的 AI 研經代理（須自行啟用——需要使用你自己的外部服務 API 金鑰）：以你選擇的語言，藉助 AI 探索你已安裝的註釋及字典，並進行其他富創意的研經流程。內建的權限系統讓你完全掌控代理可執行的操作。
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: ESV、NIV 及 NKJV
feature_12: >-
  離線可用：只有下載文件時需要上網。
# UNUSED
feature_13: >-
  研習筆記可以讓你在聆聽講道時新增筆記及參考。
subtitle_3: 我們需要大家一起造出最好的聖經工具！
paragraph_3_1: >-
  And Bible是一個開源計劃。這代表了我們需要所有有能之士，為此計劃一同用以下方式貢獻：
contr_1: 開發新功能，
contr_2: 測驗未開放的新功能，
contr_3: 保持介面翻譯更新，及
contr_4: 協助取得版權及授權、轉換文件至SWORD格式以擴充模組庫。
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
