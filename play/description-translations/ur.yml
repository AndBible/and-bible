buy_1: >
  اگر آپ کے پاس پروجیکٹ میں حصہ ڈالنے کا وقت یا مہارت نہیں ہے تو آپ پیشہ ور ڈویلپر کے کام کرنے کا وقت خرید کر بھی پروجیکٹ کی حمایت کر سکتے ہیں۔
