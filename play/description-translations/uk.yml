# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "AndBible: Вивчення Біблії"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "Вивчення Біблії: коментарі, закладки, примітки, ШІ-інструменти"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: Потужний інструмент для вивчення Біблії
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  «{{ title }}» — потужний і зручний офлайн-додаток для вивчення Біблії на Android: універсальний набір якісних інструментів для різних стилів роботи з Письмом — від звичайного читання до глибоких досліджень. Більше, ніж читалка: інструмент для серйозного особистого вивчення.
paragraph_1_2: >
  Розроблено читачами Біблії для читачів Біблії — некомерційний проєкт спільноти з відкритим кодом, повністю безкоштовний і без реклами.
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >
  Кілька популярних біблійних версій (з багатьох доступних) - І. Огієнка, НЗ П. Куліша, BJU 1996р, а також популярні коментарі, такі як Лопухіна, Барклі, Нової Женевської Біблії.
subtitle_2: Потужні функції для вивчення Біблії
paragraph_2_1: >
  Додаток має безліч проникливих, оригінальних функцій, що роблять складний та глибокий досвід вивчення Біблії більш плавним, ніж будь-коли. Найбільш помітними функціями є такі:
feature_01: "Розділені текстові подання, що дозволяють порівнювати переклади та консультаційні коментарі\n"
feature_02: Робочі області дозволяють налаштування вивчення Біблії з різними параметрами
feature_03: Інтеграція з нумерацією Стронґа дозволяє аналізувати грецькі та єврейські слова
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  Натискайте на будь-яке посилання, щоб переходити за перехресними посиланнями, виносками та коментарями ({{commentary_examples}}) або колекціями перехресних посилань ({{cross_reference_examples}}).
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: "Тлум. Біблія Лопухіна, Коментарі Барклі до НЗ, Коментарі Нової Женевської Біблії та ін.\n"
# Examples of cross-reference collections.
cross_reference_examples: "Словник Брокгауза, Л.И. Василенко, Енциклопедія архимандрита Нікіфора та ін."
feature_05: "Удосконалений синтез мовлення за допомогою закладок із мовленням, що забезпечує плавне прослуховування Біблії\n"
feature_06: Гнучкий повнотекстовий пошук одночасно в одному або кількох перекладах Біблії
feature_07: "Розширені можливості закладок та виділення тексту за допомогою особистих приміток\n"
feature_08: >
  Синхронізація між пристроями: робочі області, закладки, примітки та прогрес читання залишаються синхронізованими на всіх ваших пристроях
feature_09: >
  Відстеження читання та завчення: ставте цілі читання, контролюйте прогрес і завчайте вірші в інтерактивних режимах «Переплутані слова», «Порядок слів», «Розмиті слова» та «Введи сам»
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  Обширна бібліотека ресурсів: переклади Біблії, богословські коментарі, словники, карти та християнські книги, що складає понад {{total_documents}} ресурсів на більш ніж {{total_languages}} мовах, законно розповсюджених Crosswire та іншими сховищами SWORD.
feature_10_1: >
  Вбудована підтримка файлів MyBible, MySword і EPUB дозволяє ще більше розширити вашу бібліотеку.
feature_11: >
  Опціональний ШІ-помічник (за згодою — потрібен ваш власний API-ключ зовнішнього сервісу): досліджуйте встановлені коментарі та словники вашою мовою й інші творчі способи вивчення. Вбудована система дозволів зберігає повний контроль за вами.
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: "Біблія з коментарями за редакцією В . Боєчка, та ін."
feature_12: >-
  Офлайн: Інтернет потрібен лише для завантаження документів
# UNUSED
feature_13: >
  Панель для додавання приміток та біблійних посилань під час прослуховування проповідей
subtitle_3: Давайте разом зробимо найкращу біблійну програму!
paragraph_3_1: >
  AndBible — це проект спільноти з відкритим кодом. На практиці це означає, що будь-хто з відповідним досвідом може і заохочується робити внесок у проект шляхом:
contr_1: "розробка нових функцій,"
contr_2: "тестування ще не випущених функцій,"
contr_3: підтримка сучасних перекладів інтерфейсу та
contr_4: "допомога у розширенні бібліотеки ресурсів шляхом отримання дозволів від власників авторських прав або перетворення документів у формат SWORD.\n"
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
paragraph_4_1: "Якщо ви є професійний розробник програмного забезпечення або тестувальник, будь ласка, розгляньте можливість участі у проекті. Щоб отримати докладнішу інформацію про те, як зробити свій внесок, перегляньте статтю {{how_to_contribute_url}}.\n"
