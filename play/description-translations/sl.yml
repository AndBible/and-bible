# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "AndBible: Proučevanje Biblije"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "Močno orodje za proučevanje Biblije: komentarji, zaznamki, opombe, UI"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: Močno orodje za proučevanje Biblije
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  "{{ title }}" je zmogljiva, preprosta aplikacija za proučevanje Biblije na Androidu, ki deluje brez povezave — vsestransko orodje s kakovostnimi funkcijami za različne načine proučevanja, od sproščenega branja do poglobljenega raziskovanja. Več kot le bralnik — pravi pripomoček za resno osebno proučevanje.
paragraph_1_2: >
  Razvili so jo bralci Biblije za bralce Biblije — neprofiten odprtokoden projekt skupnosti, popolnoma brezplačen in brez oglasov.
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >
  Nekaj priljubljenih Biblij (od številnih, ki so na voljo) so KJV, NASB, NET in priljubljeni komentarji, kot sta Matthew Henry in John Gill. Na voljo so tudi slovenski prevodi Biblij: SloKJV, SloChraska in SloStritar ter Henohova knjiga.
subtitle_2: Zmogljive funkcije za proučevanje Biblije
paragraph_2_1: >
  Aplikacija ima številne vpogledne, izvirne funkcije, zaradi česar je kompleksna in poglobljena izkušnja preučevanja Biblije bolj gladka kot kdaj koli prej. Najbolj opazne lastnosti so naslednje:
feature_01: "Razdeljeni pogledi besedila omogočajo primerjavo prevodov in svetovanje komentarjev\n"
feature_02: "Delovni prostori s svojimi nastavitvami omogočajo več nastavitev proučevanja Biblije\n"
feature_03: Strong-ova števila omogočajo grško in hebrejsko besedno analizo
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  Tapnite katero koli povezavo, da sledite navzkrižnim referencam, opombam in komentarjem ({{commentary_examples}}) ali zbirkam navzkrižnih referenc ({{cross_reference_examples}}).
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: "Gill, Matthew Henry itd."
# Examples of cross-reference collections.
cross_reference_examples: "Zakladnica znanja Božje besede - Treasure of Scripture Knowledge, TSK"
feature_05: "Napredna pretvorba besedila v govor z zaznamki za govor, kar omogoča nemoteno izkušnjo poslušanja Biblije - ni še za slovenščino.\n"
feature_06: "Prilagodljivo iskanje po celotnem besedilu v enem ali več prevodih Biblije hkrati\n"
feature_07: Napredne funkcije zaznamkov in poudarjanja z osebnimi študijskimi opombami
feature_08: >
  Sinhronizacija med napravami: ohranjajte delovne prostore, zaznamke, opombe in napredek branja usklajene na vseh svojih napravah
feature_09: >
  Sledenje branju in pomnjenju: postavite si cilje branja, spremljajte napredek in si zapomnite vrstice z interaktivnimi načini Premešane besede, Vrstni red besed, Zameglitev besed in Vtipkaj.
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  Ogromna knjižnica dokumentov: prevodi Biblije, komentarji, slovarji, zemljevidi in krščanske knjige, skupaj več kot {{total_documents}} dokumentov v več {{total_languages}} jezikih, ki jih zakonito distribuira Crosswire in druge SWORD shrambe.
feature_10_1: >
  Vgrajena podpora datotekam MyBible, MySword in ePUB vam omogoča, da še bolj razširite svojo knjižnico.
feature_11: >
  Neobvezen UI pomočnik za proučevanje (samo po izrecni privolitvi — potreben je vaš lastni ključ API za zunanjo storitev): raziskujte nameščene komentarje in slovarje s pomočjo umetne inteligence v izbranem jeziku, ob drugih ustvarjalnih načinih proučevanja. Vgrajen sistem dovoljenj vam zagotavlja popoln nadzor nad tem, kaj sme pomočnik početi.
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: "ESV, NIV in NKJV"
feature_12: >
  Brez internetne povezave: internet se potrebujete le za enkraten prenos dokumentov.
# UNUSED
feature_13: >
  Študijske beležnice za dodajanje opomb in biblijskih referenc med poslušanjem pridig.
subtitle_3: Skupaj naredimo najboljšo biblijsko aplikacijo!
paragraph_3_1: >
  And Bible je projekt odprtokodne skupnosti. V praksi to pomeni, da lahko vsak, ki ima ustrezna znanja, k projektu prispeva in ga spodbuja z:
contr_1: "razvojem novih funkcij,"
contr_2: "testiranjem še neobjavljenih funkcij,"
contr_3: posodabljanjem prevodov uporabniškega vmesnika in
contr_4: "pomoč pri razširitvi knjižnice modulov s pridobivanjem dovoljenj imetnikov avtorskih pravic ali s pretvorbo dokumentov v SWORD obliko.\n"
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
