# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "AndBible: 聖書研究"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "強力な聖書研究ツール：注解書、ブックマーク、ノート、AI機能"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: 強力な聖書研究ツール
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  「{{ title }}」は、Android向けの強力で使いやすいオフライン聖書研究アプリです。気軽な通読から本格的な研究まで、さまざまな学び方に対応する高品質な機能を備えた多機能ツールキットで、単なるリーダーを超えた、本格的な個人研究のためのツールです。
paragraph_1_2: >-
  聖書を読む人によって、聖書を読む人のために開発されました。完全無料で広告のない、非営利のオープンソース・コミュニティプロジェクトです。
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >-
  多数の聖書バージョンの中でも人気なのは、KJV、NASB、NETなどです。また、マシュー・ヘンリーやジョン・ギルなどの人気注解書も利用できます。
subtitle_2: 充実した聖書研究機能
paragraph_2_1: >-
  このアプリは多くの独自機能を備えており、複雑で深い聖書研究をこれまでになくスムーズに行えます。主な機能は以下のとおりです。
feature_01: 翻訳の比較や注解書の参照を可能にする分割テキスト表示
feature_02: ワークスペースで複数の聖書研究環境をそれぞれの設定で管理
feature_03: ストロングのコンコーダンスでギリシャ語・ヘブライ語の単語分析
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  リンクをタップするだけで、ハイパーリンク化された相互参照、脚注、注解書（{{commentary_examples}}）や相互参照集（{{cross_reference_examples}}）をたどれます。
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: Gill、Matthew Henry など
# Examples of cross-reference collections.
cross_reference_examples: Treasure of Scripture Knowledge、TSKe
feature_05: スピークブックマーク付きの高度なテキスト読み上げで、快適な聖書リスニング体験
feature_06: 1つまたは複数の聖書翻訳を同時に検索できる柔軟な全文検索機能
feature_07: 個人の学習ノート付きの高度なブックマークとハイライト機能
feature_08: >-
  デバイス間同期：すべてのデバイスでワークスペース、ブックマーク、ノート、読書進捗を同期
feature_09: >-
  通読・暗唱トラッキング：通読目標を設定して進捗を記録、ワードスクランブル、ワードオーダー、ワードブラー、タイプイットなどのインタラクティブなモードで聖句を暗唱
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  充実した文書ライブラリ：聖書翻訳、神学注解書、辞書、地図、キリスト教書籍など、{{total_languages}}以上の言語で{{total_documents}}以上の文書をCrosswireおよび他のSWORDリポジトリから合法的に配布。
feature_10_1: >-
  MyBible、MySword、EPUBファイルのネイティブサポートにより、ライブラリをさらに拡張できます。
feature_11: >
  オプションのAI研究エージェント（オプトインのみ — 外部サービスのご自身のAPIキーが必要）：インストール済みの注解書や辞書をお好みの言語でAIアシスタントとともに探索でき、その他の創造的な研究ワークフローも利用可能。組み込みの権限管理システムにより、エージェントの動作を完全にコントロールできます。
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: ESV、NIV、NKJV
feature_12: >-
  オフライン対応：インターネットが必要なのは文書のダウンロード時のみ。
# UNUSED
feature_13: >-
  説教を聴きながらノートや聖書の参照を追加できるスタディパッド。
subtitle_3: 一緒に最高の聖書アプリを作りましょう！
paragraph_3_1: >-
  AndBibleはオープンソースのコミュニティプロジェクトです。つまり、適切なスキルを持つ方なら誰でも、以下の方法でプロジェクトへの貢献が歓迎されています。
contr_1: 新機能の開発、
contr_2: リリース前の機能のテスト、
contr_3: ユーザーインターフェースの翻訳の維持・更新、
contr_4: 著作権者から許可を取得したり、文書をSWORD形式に変換してモジュールライブラリの拡充を支援すること。
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
paragraph_4_1: "プロのソフトウェアエンジニアやテスターの方は、ぜひプロジェクトへの貢献をご検討ください。貢献方法の詳細については、{{how_to_contribute_url}} をご覧ください。\n"
