# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "AndBible: Bibel+"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "Bibelstudium-Toolkit: Kommentare, Lesezeichen, Notizen, KI-Tools"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: Ein mächtiges Werkzeug für das Bibelstudium
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  „{{ title }}“ ist eine leistungsstarke, einfache Offline-Bibelstudium-App für Android — ein vielseitiges Toolkit für viele Studienstile, vom gelegentlichen Lesen bis zur tiefgehenden Forschung. Mehr als nur ein Lesegerät: ein Werkzeug für ernsthaftes persönliches Studium.
paragraph_1_2: >
  Entwickelt von Bibellesern für Bibelleser — ein gemeinnütziges Open-Source-Gemeinschaftsprojekt, vollständig kostenlos und werbefrei.
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >
  Einige der erhältlichen beliebten Bibelversionen sind Schlachter 1955, NeUE, Luther 1912, sowie englische Kommentare wie Matthew Henry und John Gill.
subtitle_2: Umfangreiche Funktionen für das Bibelstudium
paragraph_2_1: >
  Das Programm hat viele originelle und aufschlussreiche Funktionen, die ein komplexes und tiefgehendes Bibelstudium einfacher als je machen. Die herausragendsten Funktionen sind:
feature_01: Geteilte Textansicht zum Vergleichen von Übersetzungen und Anzeigen von Kommentaren
feature_02: Arbeitsbereiche erlauben mehrere Konfigurationen für Bibelstudien mit jeweils eigenen Einstellungen
feature_03: Die Integration der Strong-Codes erlaubt das Nachschlagen und Analysieren von griechischen und hebräischen Vokabeln
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  Tippe auf einen Link, um Querverweisen, Fußnoten und Kommentaren ({{commentary_examples}}) oder Querverweissammlungen ({{cross_reference_examples}}) zu folgen.
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: "Gill, Matthew Henry, etc."
# Examples of cross-reference collections.
cross_reference_examples: "Treasure of Scripture Knowledge, TSKe"
feature_05: "Fortgeschrittene Sprachausgabe von Text mit Lesezeichen, für ein reibungsfreies Hörerlebnis"
feature_06: Flexible Volltextsuche in einer oder mehreren Bibelübersetzungen gleichzeitig
feature_07: Fortgeschrittene Lesezeichen- & Hervorhebungsfunktionen mit persönlichen Studiennotizen
feature_08: >
  Geräteübergreifende Synchronisierung: Arbeitsbereiche, Lesezeichen, Notizen und Lesefortschritt bleiben auf allen Geräten synchron
feature_09: >
  Lese- und Lernfortschritt: Leseziele setzen, Fortschritt verfolgen und Verse auswendig lernen mit interaktiven Modi wie Wortwirrwarr, Wortreihenfolge, Wortschleier und Eintippen
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  Große Sammlung von Dokumenten: Bibelübersetzungen, theologische Kommentare, Wörterbücher, Landkarten und christliche Bücher, insgesamt über  {{total_documents}} Dokumente in über {{total_languages}} Sprachen, gesetzeskonform zur Verfügung gestellt von Crosswire und anderen SWORD Quellen.
feature_10_1: >
  Dank der nativen Unterstützung für MyBible-, MySword- und EPUB-Dateien kannst du deine Bibliothek noch weiter erweitern.
feature_11: >
  Optionaler KI-Studienassistent (Opt-in, eigener API-Schlüssel für externen Dienst nötig): erkunde Kommentare und Wörterbücher mit KI-Hilfe in deiner Sprache, plus weitere kreative Studienabläufe. Integriertes Berechtigungssystem hält dich in voller Kontrolle.
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: "ESV, NIV, NKJV, LUT84, NGÜ etc."
feature_12: >
  Offline: das Internet wird nur für das Herunterladen der gewünschten Dokumente benötigt.
# UNUSED
feature_13: >
  Studienmappen für Notizen und Querverweise während Predigten.
subtitle_3: Lasst uns gemeinsam die beste Bibelleseapp entwickeln!
paragraph_3_1: >
  Bibel+ (AndBibel) ist ein Opensource Gemeinschaftprojekt. Das bedeutet in der Praxis, das jeder, der die entsprechenden Fähigkeiten hat, zu diesem Projekt beitragen kann, ja dazu sogar herzlich eingeladen ist. Man kann beitragen durch:
contr_1: "Entwickeln neuer Funktionen,"
contr_2: "Testen noch nicht freigegebener Funktionen,"
contr_3: "Aktuell Halten der Übersetzungen der Benutzeroberflächen, und"
contr_4: "Hilfe beim Erweitern der Dokumentbibliothek durch das Beschaffen von Genehmigungen bei den Rechteinhabern, oder durch das Konvertieren freier Dokumente in das SWORD Format."
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
paragraph_4_1: "Wenn du professioneller Softwareingenieur oder -tester bist, überlege dir bitte, ob du zu dem Projekt beitragen willst. Für mehr Informationen dazu, bitte lies {{how_to_contribute_url}}."
