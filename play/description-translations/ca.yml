# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "AndBible: Estudi Bíblic"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "Eina potent d'estudi bíblic: comentaris, marcadors, notes, eines IA"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: Potent eina d'estudi bíblic
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  «{{ title }}» és una aplicació potent, fàcil d'utilitzar i fora de línia per a l'estudi bíblic a Android, que s'adapta a molts estils d'estudi, des de la lectura ocasional fins a la recerca en profunditat. Més que un lector, és una eina per a l'estudi personal seriós.
paragraph_1_2: >
  Desenvolupada per lectors de la Bíblia, per a lectors de la Bíblia — un projecte comunitari sense ànim de lucre i de codi obert, totalment gratuït i sense anuncis.
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >
  Algunes versions populars de la Bíblia (de les moltes disponibles) són KJV, NASB, NET, i també comentaris populars com Matthew Henry i John Gill.
subtitle_2: Potents funcions d'estudi bíblic
paragraph_2_1: >
  L'aplicació té moltes funcions originals i reveladores que fan que una experiència d'estudi bíblic complex i profund sigui més fluida que mai. Les funcions més destacades són les següents:
feature_01: "Vistes de text dividides que permeten comparar traduccions i consultar comentaris\n"
feature_02: "Els espais de treball permeten múltiples configuracions d'estudi bíblic amb els seus propis ajustos\n"
feature_03: "La integració dels Números de Strong permet l'anàlisi de paraules gregues i hebrees\n"
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  Toqueu qualsevol enllaç per consultar referències creuades, notes a peu de pàgina i comentaris ({{commentary_examples}}) o col·leccions de referències creuades ({{cross_reference_examples}}).
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: "Gill, Matthew Henry, etc."
# Examples of cross-reference collections.
cross_reference_examples: "Treasure of Scripture Knowledge, TSKe"
feature_05: "Text a veu avançat amb marcadors de lectura, que permet una experiència d'escolta bíblica fluida\n"
feature_06: "Cerca flexible de text complet en una o diverses traduccions de la Bíblia simultàniament\n"
feature_07: Funcions avançades de marcadors i destacats amb notes d'estudi personals
feature_08: >
  Sincronització entre dispositius: mantingueu sincronitzats els espais de treball, marcadors, notes i progrés de lectura a tots els vostres dispositius
feature_09: >
  Seguiment de lectura i memorització: fixeu objectius de lectura, feu el seguiment del progrés i memoritzeu versets amb els modes interactius Paraules Barrejades, Ordre de Paraules, Paraules Difuminades i Escriu-ho
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  Àmplia biblioteca de documents: traduccions de la Bíblia, comentaris teològics, diccionaris, mapes i llibres cristians, amb un total de més de {{total_documents}} documents en més de {{total_languages}} idiomes, distribuïts legalment per Crosswire i altres repositoris SWORD.
feature_10_1: >
  El suport natiu per a fitxers MyBible, MySword i EPUB us permet ampliar encara més la vostra biblioteca.
feature_11: >
  Agent d'estudi amb IA opcional (cal activar-lo i requereix la vostra pròpia clau API d'un servei extern) per explorar els comentaris i diccionaris instal·lats en l'idioma que trieu. Un sistema de permisos integrat us manté el control total sobre el que pot fer l'agent.
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: "ESV, NIV i NKJV"
feature_12: >
  Fora de línia: l'única vegada que necessiteu internet és per descarregar documents.
# UNUSED
feature_13: >-
  Blocs d'estudi per afegir notes i referències bíbliques mentre escolteu sermons.
subtitle_3: Fem junts la millor aplicació bíblica!
paragraph_3_1: >
  AndBible és un projecte comunitari de codi obert. En la pràctica, això significa que qualsevol persona amb les habilitats adequades pot, i és animada a, contribuir al projecte:
contr_1: "desenvolupant noves funcions,"
contr_2: "provant funcions encara no publicades,"
contr_3: "mantenint les traduccions de la interfície d'usuari actualitzades, i"
contr_4: "ajudant a ampliar la biblioteca de mòduls obtenint permisos dels titulars dels drets d'autor o convertint documents al format SWORD.\n"
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
paragraph_4_1: "Si sou un enginyer de programari o provador professional, considereu contribuir al projecte. Per a més informació sobre com col·laborar, consulteu {{how_to_contribute_url}}.\n"
