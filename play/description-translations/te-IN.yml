# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "అండ్ బైబిల్: బైబిల్ స్టడీ"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "శక్తివంతమైన బైబిల్ టూల్‌కిట్: వ్యాఖ్యానాలు, బుక్‌మార్కులు, నోట్స్, AI సాధనాలు"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: శక్తివంతమైన బైబిల్ అధ్యయన సాధనం
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  "{{ title }}" అనేది శక్తివంతమైన, ఉపయోగించడానికి సులభమైన, ఆఫ్‌లైన్ బైబిల్ అధ్యయన యాప్ — Android కోసం రూపొందించబడిన అనేక అధ్యయన శైలులకు ఉపయోగపడే అత్యున్నత నాణ్యత గల ఫీచర్లతో కూడిన బహుముఖ టూల్‌కిట్, సాధారణ పఠనం నుండి లోతైన పరిశోధన వరకు. ఇది కేవలం ఒక రీడర్ మాత్రమే కాదు, తీవ్రమైన వ్యక్తిగత అధ్యయనం కోసం ఒక సాధనం.
paragraph_1_2: >
  బైబిల్ పాఠకులచే, బైబిల్ పాఠకుల కోసం అభివృద్ధి చేయబడింది — లాభాపేక్ష లేని, ఓపెన్-సోర్స్ కమ్యూనిటీ ప్రాజెక్ట్, పూర్తిగా ఉచితం మరియు ఎటువంటి ప్రకటనలు లేవు.
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >
  అందుబాటులో ఉన్న అనేక వాటిలో కొన్ని ప్రసిద్ధ బైబిల్ అనువాదాలు (TEL2010, TelGM, TELIRV, TeluguOV,) KJV, NASB, NET మరియు మాథ్యూ హెన్రీ మరియు జాన్ గిల్ వంటి ప్రసిద్ధ వ్యాఖ్యానాలు.
subtitle_2: ప్రత్యేకతలు
paragraph_2_1: >
  ఇ అప్లికేషన్ చాలా స్పష్టమైన కొన్ని ప్రత్యేకతలు కలిగి ఉంది, ఇది సంక్లిష్టమైన మరింత లోతైన బైబిల్ అధ్యయన అనుభవాన్ని గతంలో కంటే అద్బుతంగా తెస్తుంది. అత్యంత ముఖ్యమైన ప్రత్యేకతలు క్రింది విధంగా ఉన్నాయి:
feature_01: "వచన వీక్షణలను విభజించడం ద్వారా అనువాదాలను సరిపోల్చడం మరియు వ్యాఖ్యలను సంప్రదించడం సాధ్యమవుతుంది\n"
feature_02: "కార్యస్థలములు \"వర్క్ స్పేసెస్\" బహుళ బైబిల్ అధ్యయనాన్ని వాటి స్వంత  \"సెట్టింగ్‌లతో\" మఅరికలతో అనుమతిస్తాయి\n"
feature_03: స్ట్రాంగ్ యొక్క అనుసంధానం గ్రీక్ మరియు హీబ్రూ పదాల విశ్లేషణను సులభం చేస్తుంది
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  ఏదైనా లింక్‌ను నొక్కడం ద్వారా హైపర్‌లింక్ చేయబడిన క్రాస్-రిఫరెన్స్‌లు, ఫుట్‌నోట్స్ మరియు వ్యాఖ్యానాలు ({{commentary_examples}}) లేదా క్రాస్-రిఫరెన్స్ సేకరణలను ({{cross_reference_examples}}) అనుసరించండి.
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: "గిల్, మాథ్యూ హెన్రీ మొదలైనవి."
# Examples of cross-reference collections.
cross_reference_examples: "స్క్రిప్చర్ నాలెడ్జ్ యొక్క నిధి, TSKe"
feature_05: "అధునాతన టెక్స్ట్ టు స్పీచ్ బుక్‌మార్క్‌లతో , సాఫీగా బైబిల్ వినే అనుభవాన్ని అందిస్తుంది\n"
feature_06: ఒకే సమయంలో ఒకటి లేదా అనేక బైబిల్ అనువాదాలలో సౌకర్యవంతమైన పూర్తి-పాఠ్య శోధన
feature_07: అధునాతన బుక్‌మార్కింగ్ & హైలైట్ చేసే ప్రత్యేకతలు వ్యక్తిగత అధ్యయన గమనికలతో
feature_08: >
  క్రాస్-డివైస్ సింక్: మీ కార్యస్థలాలు, బుక్‌మార్కులు, నోట్స్ మరియు పఠన పురోగతిని మీ అన్ని పరికరాలలో సమకాలీకరించి ఉంచండి
feature_09: >
  పఠన మరియు కంఠస్థ ట్రాకింగ్: పఠన లక్ష్యాలను నిర్దేశించండి, పురోగతిని ట్రాక్ చేయండి, మరియు ఇంటరాక్టివ్ పద గందరగోళం (Word Scramble), పదాల క్రమం (Word Order), పదాల అస్పష్టత (Word Blur) మరియు టైపింగ్ (Type It) మోడ్‌లతో వచనాలను కంఠస్థం చేయండి
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  పత్రాలయొక్క విస్తారమైన లైబ్రరీ: బైబిల్ అనువాదాలు, వేదాంత వ్యాఖ్యానాలు, నిఘంటువులు, పటాలు మరియు క్రైస్తవ పుస్తకాలు, మొత్తం {{total_documents}} పైగా పత్రాలు {{total_languages}} భాషల్లో, చట్టబద్ధంగా క్రాస్‌వైర్ మరియు ఇతర స్వోర్డ్ రిపోజిటరీల ద్వారా పంపిణీ చేయబడ్డాయి.
feature_10_1: >
  MyBible, MySword మరియు EPUB ఫైల్‌లకు స్థానిక మద్దతు కల్పించటం ద్వారా మీ లైబ్రరీని మరింత విస్తరించడానికి మీకు అవకాశం కల్పిస్తుంది
feature_11: >
  ఐచ్ఛిక AI అధ్యయన సహాయకుడు (ఆప్ట్-ఇన్ మాత్రమే — బాహ్య సేవకు మీ స్వంత API కీ అవసరం): మీ ఎంచుకున్న భాషలో AI సహాయంతో ఇన్‌స్టాల్ చేసిన వ్యాఖ్యానాలు, నిఘంటువులను అన్వేషించండి. అంతర్నిర్మిత అనుమతుల వ్యవస్థతో సహాయకుడిపై మీకు పూర్తి నియంత్రణ ఉంటుంది.
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: "ESV, NIV మరియు NKJV"
feature_12: >-
  ఆఫ్‌లైన్: పత్రాలను డౌన్‌లోడ్ చేయడానికి మాత్రమే మీకు ఇంటర్నెట్ అవసరం.
# UNUSED
feature_13: >
  ప్రసంగాలు వింటున్నప్పుడు నోట్స్ మరియు బైబిల్ రిఫరెన్స్‌లను జోడించడానికి స్టడీ ప్యాడ్‌లు వున్నాయి.
subtitle_3: కలిసి అత్యుత్తమ బైబిల్ యాప్‌ని తయారు చేద్దాం రండి!
paragraph_3_1: >
  AndBible అనేది ఓపెన్ సోర్స్ కమ్యూనిటీ ప్రాజెక్ట్. ఆచరణలో, తగిన నైపుణ్యాలు ఉన్న ఎవరైనా ప్రాజెక్ట్‌కు సహకరించగలరని మరియు ప్రోత్సహించబడవచ్చని దీని అర్థం:
contr_1: "కొత్త ప్రత్యేకతలు అభివృద్ధి చేయడం,"
contr_2: "ఇంకా విడుదల కాని ప్రత్యేకతలను పరీక్షించడం,"
contr_3: వినియోగదారు ఇంటర్‌ఫేస్ అనువాదాలను తాజాగా ఉంచడం మరియు
contr_4: "కాపీరైట్ హోల్డర్ల నుండి అనుమతులను పొందడం ద్వారా లేదా పత్రాలను SWORD ఫార్మాట్ లొకి మార్చడం ద్వారా మాడ్యూల్ లైబ్రరీని విస్తరించడానికి సహాయపడగలరు.\n"
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
paragraph_4_1: "మీరు ప్రొఫెషనల్ సాఫ్ట్‌వేర్ ఇంజనీర్ లేదా టెస్టర్ అయితే, దయచేసి ప్రాజెక్ట్‌కు సహకరించడాన్ని పరిగణించండి. ఎలా సహకరించాలనే దానిపై మరింత సమాచారం కోసం, దయచేసి {{how_to_contribute_url}} ని చూడండి.\n"
subtitle_4: లింకులు
