# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "AndBible: 성경 공부"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "강력한 성경 공부 도구 모음: 주석, 북마크, 노트, AI 기능"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: 강력한 성경 공부 도구
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  "{{ title }}"는 강력하고 사용하기 쉬운 오프라인 안드로이드 성경 공부 앱입니다. 가벼운 읽기부터 깊이 있는 연구까지 다양한 공부 스타일에 맞는 고품질 기능을 갖춘 다재다능한 도구 모음으로, 단순한 성경 리더기가 아닌 진지한 개인 연구를 위한 도구입니다.
paragraph_1_2: >-
  성경을 읽는 사람들이, 성경을 읽는 사람들을 위해 만든 앱입니다. 비영리 오픈소스 커뮤니티 프로젝트로, 완전히 무료이며 광고가 전혀 없습니다.
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >-
  많은 번역본 중에서 인기 있는 것들은 KJV, NASB, NET 등이고 Matthew Henry와 John Gill 주석도 인기가 있습니다.
subtitle_2: 강력한 성경 공부 기능
paragraph_2_1: >
  이 앱에는 복잡하고 깊은 성경 공부 경험을 가장 효과적으로 만들어줄 세심하고 독창적인 기능들이 많이 있습니다. 가장 특징적인 기능들은 다음과 같습니다:
feature_01: 번역본들을 비교하거나 주석을 참조하는 것을 가능하게 하는 창 나누기
feature_02: 여러 개의 성경 공부 세팅을 활용할 수 있는 워크스페이스
feature_03: 헬라어와 히브리어 단어 분석을 위한 스트롱 통합
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  하이퍼링크된 교차 참조, 각주, 주석({{commentary_examples}}) 또는 교차 참조 모음({{cross_reference_examples}})을 따라가려면 링크를 누르세요.
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: "Gill, Matthew Henry 등"
# Examples of cross-reference collections.
cross_reference_examples: "Treasure of Scripture Knowledge, TSKe"
feature_05: 부드러운 성경 듣기 경험을 가능하게 하는 발전된 텍스트 읽기 기능
feature_06: 한 개 또는 여러 성경 번역본을 동시에 검색할 수 있는 유연한 전체 본문 검색
feature_07: 개인 연구 노트 기능과 함께 우수한 북마크와 하이라이트 기능
feature_08: >-
  여러 기기 간 동기화: 모든 기기에서 워크스페이스, 북마크, 노트, 읽기 진행 상황을 동기화하여 유지
feature_09: >
  읽기 및 암송 추적: 읽기 목표를 설정하고 진행 상황을 추적하며, 단어 뒤섞기, 단어 순서 맞추기, 단어 흐림, 직접 입력하기 모드로 구절을 암송하세요
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  방대한 문서 라이브러리: 성경 번역본, 신학 주석, 사전, 지도, 기독교 서적, 모두 ({{total_languages}}) 개 이상의 언어로 된 ({{total_documents}}) 이상의 자료들이 Crosswire와 다른 SWORD 저장소로부터 합법적으로 제공됨.
feature_10_1: >-
  MyBible, MySword 및 EPUB 파일에 대한 기본 지원으로 라이브러리를 더욱 확장할 수 있습니다.
feature_11: >
  선택형 AI 공부 도우미(직접 활성화 필요 — 외부 서비스의 본인 API 키가 필요함): 설치한 주석과 사전을 원하는 언어로 AI의 도움을 받아 탐색할 수 있고, 그 외 다양한 창의적인 공부 워크플로를 활용할 수 있습니다. 내장된 권한 시스템으로 도우미가 수행할 수 있는 작업을 사용자가 완전히 통제할 수 있습니다.
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: "ESV, NIV 그리고 NKJV"
feature_12: >-
  오프라인: 다운로르 받을 때는 제외하면 인터넷이 필요 없음
# UNUSED
feature_13: >-
  설교를 들으면서 노트를 적거나 성경 참조를 넣을 수 있는 스터디 패드.
subtitle_3: 최고의 성경 앱을 함께 만들어요!
paragraph_3_1: >
  And Bible은 오픈소스 커뮤니티 프로젝트입니다. 사실 이것은 이런 적절한 기술을 가진 분이면 누구든 이 프로젝트에 기여할 수 있고, 해 달라고 요청을 드리는 것입니다:
contr_1: "새 기능 개발,"
contr_2: "베타 기능 테스트,"
contr_3: "인터페스스 번역을 최신으로 유지, 그리고"
contr_4: 저작권자로부터 배포 허가를 받거나 SWORD 포맷 문서를 변환하여 모듈 라이브러리를 확장하는데 도움을 줌
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
paragraph_4_1: "만약 개발자 또는 테스터시라면, 프로젝트에 도움을 주는 것을 고려해 주세요. 어떻게 기여할 수 있는지 알아보시려면, {{how_to_contribute_url}} 을 참고해 주세요.\n"
