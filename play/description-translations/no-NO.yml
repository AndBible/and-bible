# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "AndBible: Bibelstudie"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "Kraftig bibelstudie: kommentarer, bokmerker, notater, AI-verktøy"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: Kraftig bibelstudie-verktøy
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  «{{ title }}» er en kraftig og brukervennlig bibelstudie-app for Android som fungerer frakoblet — et allsidig verktøysett med funksjoner av høy kvalitet som passer mange studiestiler, fra avslappet lesning til dyptgående forskning. Mer enn bare en leser; det er et verktøy for seriøse, personlige bibelstudier.
paragraph_1_2: >
  Utviklet av bibellesere, for bibellesere — et ideelt fellesskapsprosjekt med åpen kildekode som er helt gratis og uten reklame.
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >
  Et utvalg populære bibeloversettelser er King James, Bibelen 1930 og Studentmållagsbibelen 1921. Du finner også bibelkommentarer som Matthew Henry og John Gill.
subtitle_2: Kraftige bibelstudie-finesser
paragraph_2_1: >
  Applikasjonen har mange innsiktsfulle og originale finesser som gjør komplekse og dype bibelstudier lettere enn før. De mest bemerkelsesverdige finessene er:
feature_01: Oppdeling av tekstvisningen for å sammenligne oversettelser og bibelkommentarer
feature_02: Arbeidsområder tillater flere bibelstudieoppsett med egne innstillinger
feature_03: Integrasjon med Strong's bibelordbøker åpner for greske og hebraiske ordanalyser
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  Trykk på en hvilken som helst lenke for å følge kryssreferanser, fotnoter og bibelkommentarer ({{commentary_examples}}) eller samlinger av kryssreferanser ({{cross_reference_examples}}).
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: "Gill, Matthew Henry osv."
# Examples of cross-reference collections.
cross_reference_examples: "Treasure of Scripture Knowledge, TSKe"
feature_05: "Avansert tekst-til-tale med bokmerke-tale åpner for en strømlinjet bibellytte-opplevelse\n"
feature_06: Fleksibelt fulltekstsøk i én eller flere bibeloversettelser samtidig
feature_07: Avansert bokmerking og fokusmuligheter med personlige studienotater
feature_08: >
  Synkronisering mellom enheter: hold arbeidsområder, bokmerker, notater og lesefremgang synkronisert på alle enhetene dine
feature_09: >
  Oppfølging av lesing og memorering: sett deg lesemål, følg fremdriften og lær vers utenat med interaktive moduser som Bokstavkrøll, Ordrekkefølge, Ordutydning og Skriv selv
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  Et stort bibliotek av moduler: Bibeloversettelser, teologiske bibelkommentarer, bibelordbøker, kart og kristne bøker som teller over {{total_documents}} moduler på over {{total_languages}} språk, fritt distribuert av Crosswire og andre SWORD pakkebrønner (repositories).
feature_10_1: >
  Innebygd støtte for MyBible-, MySword- og EPUB-filer gjør at du kan utvide biblioteket ditt enda mer.
feature_11: >
  Valgfri AI-studieassistent (kun ved aktivt valg — krever din egen API-nøkkel for en ekstern tjeneste): utforsk dine installerte bibelkommentarer og ordbøker med AI-hjelp på språket du velger, samt andre kreative måter å studere på. Et innebygd tillatelsessystem gir deg full kontroll over hva assistenten kan gjøre.
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: NO78/85 og NB88/07
feature_12: >
  Frakoblet modus: du trenger bare være påkoblet internett når du skal laste ned moduler.
# UNUSED
feature_13: >
  Studiebrett for å skrive notater og bibelreferanser samtidig som man lytter til undervisning.
subtitle_3: La oss bygge den beste Bibel-applikasjonen sammen!
paragraph_3_1: >
  And Bibel er et åpen kildekode-prosjekt. I praksis betyr dette at hvem som helst med riktige kvalifikasjoner kan, og oppfordres til å bidra i prosjektet ved å:
contr_1: "utvikle nye funksjoner,"
contr_2: "teste nye funksjoner som ikke er utgitt enda,"
contr_3: "holde oversettelse av brukergrensesnittet oppdatert, og"
contr_4: "hjelpe til med å utvide modulbiblioteket ved å skaffe tillatelser fra rettighetshavere, eller ved å konvertere dokumenter til SWORD-format.\n"
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
