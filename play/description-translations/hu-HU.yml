# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "AndBible: Biblia"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "Hatékony bibliatanulmányozó: kommentárok, könyvjelzők, jegyzetek, MI"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: Bibliatanulmányozó alkalmazás
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  A „{{ title }}" egy hatékony, könnyen használható, offline bibliatanulmányozó alkalmazás Androidra — sokoldalú eszköztár az alkalmi olvasástól a részletes kutatásig. Több mint olvasó: komoly személyes tanulmányozás eszköze.
paragraph_1_2: >
  Bibliaolvasók fejlesztették bibliaolvasóknak — non-profit, nyílt forráskódú közösségi projekt, teljesen ingyenes és reklámmentes.
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >
  Az applikációban magyarul több fordítás érhető el: többek közt a Károli Biblia 1908-as revíziója, a Magyar Bibliatársulat Újfordítású Bibliájának 1990 és 2014-es változata és a Káldi Neovulgáta modern változata is. Angolul a népszerű KJV, NASB, NET fordítások és az ugyancsak népszerű Matthew Henry és John Gill kommentárok is elérhetőek, a több száz egyéb nyelvű bibliafordítással  és kommentárral együtt.
subtitle_2: Bibliatanulmányozó funkciók
paragraph_2_1: >
  Az app számos különleges funkcióval rendelkezik, amelyek az öszetett és alapos bibliatanulmányozást még egyszerűbbé teszik. A elismerésre legméltóbb funkciók:
feature_01: "Megosztott képernyős mód, amely lehetővé teszi a különböző forditások összehasonlítását, vagy a kommentárok a Bibilia szövegével párhuzamos olvasását\n"
feature_02: "A Munkaasztalok segítségével több kölönböző saját beállításokkal rendelkező bibliatanulmányozási konfiguráció létrehozására van lehetőség\n"
feature_03: "A Strong-konkordancia (szómutató) integráció lehetővé teszi a görög és héber szóanalízist.\n"
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  Bármely hivatkozásra koppintva követheti a kapcsolt kereszthivatkozásokat, lábjegyzeteket és kommentárokat ({{commentary_examples}}), valamint a kereszthivatkozás-gyűjteményeket ({{cross_reference_examples}}).
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: "Gill, Matthew Henry stb."
# Examples of cross-reference collections.
cross_reference_examples: "Treasury of Scripture Knowledge, TSKe"
feature_05: "Fejlett felolvasási képességek (a támogatott nyelveken), beszéd könyvjelzők, hogy tényleg akadálymentesen hallgathassa a Bibliát.\n"
feature_06: Rugalmas teljes szöveges keresés egy vagy több bibliafordításban
feature_07: "Fejlett könyvjelző és kijelölési lehetőségek, személyes jegyzetek"
feature_08: >
  Eszközök közötti szinkronizáció: munkaterületek, könyvjelzők, jegyzetek és olvasási előrehaladás szinkronja minden eszközön
feature_09: >
  Olvasás- és memorizáláskövetés: olvasási célok, előrehaladás-követés, és versek memorizálása interaktív Szókeverő, Szósorrend, Szóhomály és Begépelés módokkal
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  Modulkönyvtár: bibliafordítások, teológiai kommentárok, szótárak, térképek és keresztény irodalom, összesen {{total_documents}} mű, {{total_languages}} nyelven,  jogtisztán letölthetően a Crosswire és egyéb SWORD modulkönyvtárakból.
feature_10_1: >
  A MyBible, MySword és EPUB fájltípusok natívan támogatottak, így még teljesebb lehet a könyvtárad.
feature_11: >
  Választható MI-tanulmányozó ügynök (csak igény szerint — saját API-kulcs szükséges külső szolgáltatóhoz): fedezze fel kommentárjait és szótárait MI segítségével a választott nyelven, kreatív tanulmányozási módokkal. Beépített engedélyrendszer tartja teljes ellenőrzése alatt az ügynök tevékenységét.
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: "ESV, NIV és NKJV"
feature_12: >
  Offline: csak a bibliamodulok letöltésekor van szükség aktív internetkapcsolatra.
# UNUSED
feature_13: >
  Jegyzetlapok jegyzetekkel és biblia hivatkozásokkal: igehirdetésre készülve vagy igehirdetés hallgatása közben.
subtitle_3: Segítsen az alkalmazás jobbá tételében!
paragraph_3_1: >
  Az And Bible nyílt forráskódú közösségi projekt. Bárkit, aki megfelelő képességekkel rendelkezik, bátorítunk a közreműködésre:
contr_1: új funkciók kifejlesztésével
contr_2: újonnan fejlesztett funkciók tesztelésével
contr_3: a felhasználói felület fordításainak karbantartásával és
contr_4: "a modulkönyvtár fejlesztésével: dokumentumok SWORD formátumba konvertálásával vagy a jogtulajdonosoktól a megfelelő engedélyek beszerzésével.\n"
