# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "AndBible: Biblija Studij"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "Moćan alat za proučavanje Biblije: tumačenja, straničnici, bilješke, AI"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: Moćno sredstvo za učenje Svetoga pisma
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  "{{ title }}" je moćna i jednostavna izvanmrežna aplikacija za proučavanje Biblije na Androidu — svestran skup visokokvalitetnih značajki za različite stilove proučavanja, od ležernog čitanja do dubinskog istraživanja. Više od običnog čitača — pravi alat za ozbiljno osobno proučavanje.
paragraph_1_2: >
  Razvijena od strane čitatelja Biblije za čitatelje Biblije — neprofitan projekt zajednice otvorenog koda, potpuno besplatan i bez oglasa.
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >
  Nekoliko najpoznatijih prijevoda Biblije (od mnogih dostupnih) su KJV, NASB, NET i također, popularna tumačenja kao što su tumačenja Matthew Henrya i John Gilla.
subtitle_2: Moćne funkcije za proučavanje Biblije.
paragraph_2_1: >
  Aplikacija ima mnoge originalne funkcije koje čine detaljno proučavanje Biblije lakšim nego ikad. Značajne funkcije su sljedeće:
feature_01: "Dijeljenje pregleda teksta koje omogućava uspoređivanje prijevoda i pretraživanje u tumačenjima\n"
feature_02: "Radne površine omogućavaju više postavki za proučavanje Biblije sa odvojenim podešavanjima\n"
feature_03: Integracija Strongovog rječnika omogućava analizu grčkih i hebrejskih riječi
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  Dodirnite bilo koju poveznicu kako biste pratili unakrsne reference, fusnote i tumačenja ({{commentary_examples}}) ili zbirke unakrsnih referenci ({{cross_reference_examples}}).
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: "Gill, Matthew Henry itd."
# Examples of cross-reference collections.
cross_reference_examples: "Treasure of Scripture Knowledge, TSKe"
feature_05: "Napredni tekst - u - govor sa izgovorom straničnika, koje omogućava glatki doživljaj slušanja Svetoga pisma\n"
feature_06: "Fleksibilno cjelovito pretraživanje teksta u jednom ili više biblijskih prijevoda istovremeno\n"
feature_07: Napredno straničnikanje i isticanja značajki sa osobnim bilješkama za učenje
feature_08: >
  Sinkronizacija među uređajima: držite svoje radne površine, straničnike, bilješke i napredak čitanja usklađenima na svim svojim uređajima
feature_09: >
  Praćenje čitanja i pamćenja: postavljajte ciljeve čitanja, pratite napredak i pamtite retke u interaktivnim načinima Miješanje riječi, Redoslijed riječi, Zamućenje riječi i Upisivanje
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  Ogromna biblioteka dokumenata: biblijskih prijevoda, teoloških tumačenja, rječnika, karata i kršćanskih knjiga, čiji ukupan broj izlazi na preko  {{total_documents}} dokumenata na više od  {{total_languages}} jezika, legalno distribuiranih od strane Crosswire i drugih SWORD repozitorija
feature_10_1: >
  Izvorna podrška za MyBible, MySword i EPUB datoteke pruža mogućnosti da još više proširite Vašu biblioteku
feature_11: >
  Neobavezni AI pomoćnik za proučavanje (samo na zahtjev — potreban je vaš osobni API ključ za vanjsku uslugu): istražujte instalirana tumačenja i rječnike uz AI pomoć na odabranom jeziku, uz druge kreativne načine proučavanja. Ugrađeni sustav dopuštenja drži vas pod punom kontrolom nad onime što pomoćnik smije činiti.
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: "ESV, NIV i NKJV"
feature_12: >-
  Izvanmrežno: jedino kada Vam treba internet jeste za preuzimanje dokumenata.
# UNUSED
feature_13: >
  Radne bilježnice za dodavanje bilješki i biblijskih referenci za vrijeme slušanja propovijedi
subtitle_3: Hajde da zajedno napravimo najbolju biblijsku aplikaciju!
paragraph_3_1: >
  AndBible je projekt zajednice otvorenog koda. U praksi, ovo znači da svatko tko ima određeni niz vještina može, uz ohrabrenje, da doprinese projektu:
contr_1: razvijanjem novih funkcija
contr_2: testiranjem još uvijek neobjavljenih funkcija
contr_3: "održavanjem prijevoda korisničkog sučelja ažurnim, i"
contr_4: "pomažući u proširenju modula biblioteke zadobivanjem dozvola od vlasnika autorskih prava, ili pretvaranjem dokumenata u SWORD format.\n"
