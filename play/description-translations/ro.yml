# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "AndBible: Biblia"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "Studiu biblic complet: comentarii, semne de carte, notițe, AI"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: O unealtă pentru studiul Bibliei
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  „{{ title }}" este o aplicație offline puternică și ușor de folosit pentru studiul Bibliei pe Android — un set versatil de unelte de calitate, de la citire ocazională la cercetare aprofundată. Mai mult decît un cititor, este o unealtă pentru studiul personal serios.
paragraph_1_2: >
  Dezvoltată de cititori ai Bibliei pentru cititori ai Bibliei — un proiect comunitar non-profit, cu sursă deschisă, gratuit și fără reclame.
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >
  Cîteva versiuni populare ale Bibliei (din cele multe disponibile) sînt Cornilescu, KJV, NASB, Diodati, precum și comentarii populare precum Matthew Henry și John Gill.
subtitle_2: Caracteristici eficiente de studiu biblic
paragraph_2_1: >
  Aplicația are multe caracteristici originale și interesante, care fac ca experiența studiului biblic complex și profund să fie mai ușoară ca niciodată. Cele mai notabile caracteristici sînt următoarele:
feature_01: "Vizualizări separate ale textului care permit compararea traducerilor și consultarea comentariilor\n"
feature_02: "Spațiile de studiu permit organizarea mai multor studii biblice cu propriile reglări\n"
feature_03: Integrarea Strong permite analiza cuvintelor grecești și ebraice
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  Apasă pe orice legătură pentru a urmări trimiteri, note de subsol, comentarii ({{commentary_examples}}) sau colecții de trimiteri ({{cross_reference_examples}}).
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: "Gill, Matthew Henry etc."
# Examples of cross-reference collections.
cross_reference_examples: "Treasure of Scripture Knowledge, TSKe"
feature_05: "Pronunțarea avansată a textului cu marcaje de vorbire, permițînd o experiență de ascultare ușoară a Bibliei\n"
feature_06: "Căutare flexibilă în text complet, în una sau mai multe traduceri simultan"
feature_07: Semne de carte și evidențiere avansată cu notițe de studiu personale
feature_08: >
  Sincronizare între dispozitive: spațiile de studiu, semnele de carte, notițele și progresul citirii rămîn sincronizate
feature_09: >
  Urmărirea citirii și memorării: stabilește obiective, urmărește progresul și memorează versete cu modurile Cuvinte amestecate, Ordinea cuvintelor, Cuvinte estompate și Scrie tu
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  O vastă bibliotecă de documente: Traduceri ale Bibliei, comentarii teologice, dicționare, hărți și cărți creștine, totalizînd peste {{total_documents}} documente în peste {{total_languages}} limbi, distribuite legal de Crosswire și alte depozite SWORD.
feature_10_1: >
  Compatibilitatea nativă cu fișierele MyBible, MySword și EPUB permite o extindere și mai mare a bibliotecii tale.
feature_11: >
  Agent AI opțional pentru studiu (doar la cerere — necesită propria cheie API pentru un serviciu extern): explorează comentariile și dicționarele instalate cu AI în limba aleasă. Un sistem de permisiuni îți păstrează controlul deplin asupra acțiunilor agentului.
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: "ESV, NIV și NKJV"
feature_12: >
  Offline: singurul moment în care aveți nevoie de internet este pentru a descărca documente.
# UNUSED
feature_13: >
  Notițe de studiu pentru a adăuga comentarii și trimiteri biblice în timp ce asculți predicile.
subtitle_3: Haideți să facem împreună cea mai bună aplicație biblică!
paragraph_3_1: >
  AndBible este un proiect comunitar care are codul sursă public. În practică, aceasta înseamnă că orice persoană cu competențe adecvate poate și este încurajată să contribuie la proiect prin:
contr_1: "realizarea de noi caracteristici,"
contr_2: "testarea caracteristicilor care nu au fost încă lansate,"
contr_3: menținerea la zi a traducerilor interfeței cu utilizatorul și
contr_4: "contribuind la extinderea bibliotecii de documente prin obținerea de permisiuni de la deținătorii drepturilor de autor sau prin convertirea documentelor în format SWORD.\n"
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
paragraph_4_1: "Dacă ești programator sau ai experiență la încercarea aplicațiilor, te rugăm să contribui la acest proiect. Pentru mai multe informații despre cum să contribuiți, vă rugăm să consultați {{how_to_contribute_url}}.\n"
