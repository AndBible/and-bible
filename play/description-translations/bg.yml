# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "AndBible: Библейско проучване"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "Мощни инструменти за изучаване: коментари, отметки, бележки, ИИ помощ"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: Мощен инструмент за изучаване на Библията
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  „{{ title }}“ е мощно, лесно за използване офлайн приложение за изучаване на Библията на Android — универсален набор от висококачествени функции, подходящи за различни стилове на изучаване, от непринудено четене до задълбочено изследване. Това е повече от четец — то е инструмент за сериозно лично изучаване.
paragraph_1_2: >
  Разработено от читатели на Библията за читатели на Библията — общностен проект с нестопанска цел и отворен код, напълно безплатен и без реклами.
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >
  Няколко популярни библейски версии (от многото налични) са KJV, NASB, NET, а също и популярни коментари като Matthew Henry и John Gill.
subtitle_2: Мощни функции за изучаване на Библията
paragraph_2_1: >
  Приложението разполага с много оригинални и полезни функции, които правят сложното и задълбочено изучаване на Библията по-лесно от всякога. Най-забележителните функции са следните:
feature_01: Разделен изглед на текст за сравняване на преводи и консултиране с коментари
feature_02: "Работните пространства позволяват множество конфигурации за изучаване с техните собствени настройки\n"
feature_03: Интеграцията на Strong's позволява анализ на гръцки и еврейски думи
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  Докоснете всяка връзка, за да отворите хипервръзките към препратки, бележки под линия и коментари ({{commentary_examples}}) или сборници с препратки ({{cross_reference_examples}}).
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: "Gill, Matthew Henry и др."
# Examples of cross-reference collections.
cross_reference_examples: "Treasure of Scripture Knowledge, TSKe"
feature_05: "Разширено четене на глас с отметки за слушане, позволяващо приятно слушане на Библията\n"
feature_06: "Гъвкаво пълнотекстово търсене в един или едновременно в множество библейски преводи\n"
feature_07: Разширени функции за отметки и маркиране с лични учебни бележки
feature_08: >
  Синхронизация между устройства: поддържайте работните си пространства, отметки, бележки и напредъка на четенето синхронизирани на всички ваши устройства
feature_09: >
  Проследяване на четенето и наизустяването: поставяйте цели за четене, следете напредъка и наизустявайте стихове чрез интерактивни режими — Разбъркани думи, Подреди думите, Замъглени думи и Напиши го
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  Обширна библиотека с ресурси: библейски преводи, богословски коментари, речници, карти и християнски книги — общо над {{total_documents}} документа на над {{total_languages}} езика, законно разпространявани от Crosswire и други SWORD хранилища.
feature_10_1: >
  Вградената поддръжка на MyBible, MySword и EPUB файлове ви позволява да разширите библиотеката си още повече.
feature_11: >
  Незадължителен ИИ агент за изучаване (само по избор — изисква собствен API ключ за външна услуга): изследвайте инсталираните си коментари и речници с помощта на ИИ на избран от вас език, заедно с други творчески подходи към изучаването. Вградена система за разрешения ви дава пълен контрол върху действията на агента.
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: "ESV, NIV и NKJV"
feature_12: >-
  Офлайн режим: интернет е необходим само при изтегляне на документи.
# UNUSED
feature_13: >-
  Бележници за добавяне на бележки и библейски препратки докато слушате проповеди.
subtitle_3: Нека заедно да създадем най-доброто приложение за Библията!
paragraph_3_1: >
  AndBible е проект с отворен код. На практика това означава, че всеки с подходящи умения може и се насърчава да допринесе за проекта чрез:
contr_1: "разработване на нови функции,"
contr_2: "тестване на все още неиздадени функции,"
contr_3: "поддържане на актуални преводи на потребителския интерфейс, и"
contr_4: "помощ за разширяване на библиотеката с модули чрез получаване на разрешения от носители на авторски права или чрез конвертиране на документи в SWORD формат.\n"
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
