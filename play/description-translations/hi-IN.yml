# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "AndBible: बाइबिल"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "बाइबिल अध्ययन टूलकिट: कमेंटरी, बुकमार्क, नोट्स, AI टूल्स"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: बाइबिल पढ़ने की शक्तिशाली उपकरण
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  "{{ title }}" एक शक्तिशाली, उपयोग में आसान, ऑफ़लाइन बाइबिल अध्ययन ऐप है Android के लिए — उच्च-गुणवत्ता वाले फ़ीचर्स का एक बहुमुखी टूलकिट जो आकस्मिक पठन से लेकर गहन शोध तक, अनेक अध्ययन शैलियों के लिए उपयुक्त है। यह केवल एक रीडर नहीं, बल्कि गंभीर व्यक्तिगत अध्ययन के लिए एक उपकरण है।
paragraph_1_2: >
  बाइबिल पाठकों द्वारा, बाइबिल पाठकों के लिए विकसित — एक गैर-लाभकारी, ओपन-सोर्स सामुदायिक परियोजना जो पूरी तरह से निःशुल्क है और जिसमें कोई विज्ञापन नहीं है।
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >
  कुछ लोकप्रिय बाइबल संस्करण (कई उपलब्ध हैं) KJV, NASB, NET, और मैथ्यू हेनरी और जॉन गिल जैसी लोकप्रिय टिप्पणियां भी हैं।
subtitle_2: शक्तिशाली बाइबिल अध्ययन विशेषताएं
paragraph_2_1: >
  एप्लिकेशन में कई व्यावहारिक, मूल विशेषताएं हैं, जो एक जटिल और गहन बाइबिल अध्ययन के अनुभव को पहले से कहीं अधिक आसान बनाती हैं। सबसे उल्लेखनीय विशेषताएं इस प्रकार हैं:
feature_01: "विभाजित पाठ द्रिश्य जो अनुवादों और परामर्श टिप्पणियों की तुलना करने में सक्षम बनाते हैं\n"
feature_02: "कार्यक्षेत्र कई बाइबिल अध्ययन सेटअप अपने-अपने सेटिंग के साथ लाने की अनुमति देते हैं\n"
feature_03: स्ट्रांग का एकीकरण ग्रीक और हिब्रू शब्द विश्लेषण की अनुमति देता है
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  किसी भी लिंक पर टैप करके हाइपरलिंक किए गए क्रॉस-रेफरेंस, फ़ुटनोट और कमेंटरी ({{commentary_examples}}) या क्रॉस-रेफरेंस संग्रह ({{cross_reference_examples}}) का अनुसरण करें।
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: "गिल, मैथ्यू हेनरी आदि।"
# Examples of cross-reference collections.
cross_reference_examples: "ट्रेज़र ऑफ़ स्क्रिप्चर नॉलेज, TSKe"
feature_05: "उच्च टेक्स्ट टू स्पीच बोलने के बुकमार्क के साथ, एक सहज बाइबल सुनने के अनुभव को सक्षम करता है\n"
feature_06: एक या एक साथ कई बाइबिल अनुवादों में लचीली पूर्ण-पाठ खोज
feature_07: व्यक्तिगत अध्ययन नोट्स के साथ उच्च बुकमार्किंग और हाइलाइटिंग सुविधाएँ
feature_08: >
  क्रॉस-डिवाइस सिंक: अपने सभी डिवाइसों पर अपने कार्यक्षेत्र, बुकमार्क, नोट्स और पठन प्रगति को समकालिक रखें
feature_09: >
  पठन और स्मरण ट्रैकिंग: पठन लक्ष्य निर्धारित करें, प्रगति पर नज़र रखें, और इंटरैक्टिव शब्द-अव्यवस्था (Word Scramble), शब्द-क्रम (Word Order), शब्द-धुंधलाहट (Word Blur) और लिखकर अभ्यास (Type It) मोड के साथ छंद याद करें
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  दस्तावेज़ों का विशाल पुस्तकालय: क्रॉसवायर और अन्य SWORD रिपॉजिटरी द्वारा कानूनी रूप से वितरित बाइबिल अनुवाद, धार्मिक टिप्पणियां, शब्दकोश, मानचित्र और ईसाई पुस्तकें {{total_languages}} से अधिक भाषाओं में कुल {{total_documents}} दस्तावेज़।
feature_10_1: >
  MyBible, MySword और EPUB फ़ाइलों के लिए मूल सहायता आपको अपनी पुस्तकालय को और भी अधिक विस्तृत करने में सक्षम बनाती है।
feature_11: >
  वैकल्पिक AI अध्ययन एजेंट (केवल ऑप्ट-इन — किसी बाहरी सेवा के लिए आपकी अपनी API कुंजी आवश्यक): अपनी पसंदीदा भाषा में AI सहायता के साथ अपनी इंस्टॉल की गई कमेंटरी और शब्दकोशों का अन्वेषण करें, साथ ही अन्य रचनात्मक अध्ययन कार्यप्रवाह। एक अंतर्निहित अनुमति प्रणाली आपको पूर्ण नियंत्रण में रखती है कि एजेंट क्या कर सकता है।
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
