unavailable_documents: "ESV, NIV और NKJV"
feature_12: >
  ऑफ़लाइन: आपको केवल दस्तावेज़ों को डाउनलोड करने के लिए इंटरनेट की आवश्यकता होती है।
# UNUSED
feature_13: >-
  उपदेश सुनने के दौरान नोट्स और बाइबिल संदर्भ जोड़ने के लिए अध्ययन पैड।
subtitle_3: आइए एक साथ सर्वश्रेष्ठ बाइबिल ऐप बनाएं!
paragraph_3_1: >
  ऐंड बाइबिल एक खुला स्रोत सामुदायिक परियोजना है। इसका मतलब है कि उपयुक्त कौशल वाला कोई भी व्यक्ति इस परियोजना में योगदान इसके द्वारा कर सकता है:
contr_1: "नई सुविधाओं का विकास,"
contr_2: "अभी तक जारी नहीं की गई सुविधाओं का परीक्षण,"
contr_3: "यूजर इंटरफ़ेस अनुवादों को अप-टू-डेट रखना, और"
contr_4: "कॉपीराइट धारकों से अनुमति प्राप्त करके या दस्तावेज़ों को SWORD फॉर्मेट में परिवर्तित करके मॉड्यूल लाइब्रेरी का विस्तार करने में मदद करना।\n"
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
paragraph_4_1: "यदि आप एक पेशेवर सॉफ्टवेयर इंजीनियर या परीक्षक हैं, तो कृपया परियोजना में योगदान करने पर विचार करें। योगदान करने के तरीके के बारे में अधिक जानकारी के लिए, कृपया {{how_to_contribute_url}} देखें।\n"
