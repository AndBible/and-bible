# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "AndBible: Piibliuuring"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: Loe piiblit, uuri kommentaare, sõnaraamatuid või raamatuid võrguühenduseta.
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: Võimas piibliuurimise tööriist
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  "{{ title }}" on võimas, kuid lihtne kasutada, interneti ühenduseta piibliuurimise rakendus Androidile. Rakendus ei püüa olla lihtsalt piibliluger, vaid keskendub täiustatud tööriistaks olemisele põhjalikuks isiklikuks piibliuurimiseks.
paragraph_1_2: >
  Seda rakendust on arendanud piiblilugejad piiblilugejatele. Selle eesmärk on muuta sinu piibliuuring mugavaks, põhjalikuks ja lõbusaks. Parim osa selles mittetulundusühinguprojektis on see, et see on avatud lähtekoodiga, täiesti tasuta ja ilma reklaamideta.
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >
  Mõned populaarsed piibli versioonid (paljudest saadaolevatest) on KJV, NASB, NET ja ka populaarsed kommentaarid nagu Matthew Henry ja John Gill.
subtitle_2: Võimsad piibliuurimise funktsioonid
paragraph_2_1: >
  Rakendusel on palju originaalseid funktsioone, mis muudavad keeruka ja põhjaliku piibliuurimise kogemuse sujuvamaks kui kunagi varem. Olulisemad funktsioonid on järgmised:
feature_01: >
  Jagatud tekstivaated, mis võimaldavad tõlkeid võrrelda ja kommentaare konsulteerida
feature_02: Tööalad võimaldavad mitut piibliuurimise seadistust oma seadetega
feature_03: Strongi integreerimine võimaldab kreeka ja heebrea sõnade analüüsi
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  Lingitud ristviited, allmärkused ja dokumendid; hüppa ristviidete ja allmärkuste juurde lihtsalt linki puudutades; tee põhjalik Pühakirja uuring lingitud kommentaaride ({{commentary_examples}}), ristviidete kogumike ({{cross_reference_examples}}) ja teiste ressursside abil.
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: Gill, Matthew Henry jne.
# Examples of cross-reference collections.
cross_reference_examples: Treasure of Scripture Knowledge, TSKe
feature_05: >
  Täiustatud tekst kõneks koos kõnelemise järjehoidjatega, mis võimaldab sujuvat piibli kuulamise kogemust
feature_06: Paindlik otsimine
feature_07: >
  Täiustatud järjehoidja ja esiletõstmise funktsioonid koos isiklike uurimismärkmetega
feature_09: "Lugemiskavad: sea eesmärgid piibli lugemiseks"
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  Lai dokumentide kogu: piibli tõlked, teoloogilised kommentaarid, sõnaraamatud, kaardid ja kristlikud raamatud, kokku üle {{total_documents}} dokumendi üle {{total_languages}} keeles, mida jagavad seaduslikult Crosswire ja teised SWORD hoidlad.
feature_10_1: >
  MyBible, MySword ja EPUB failide natiivne tugi võimaldab sul oma kogu veelgi laiendada.
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: ESV, NIV ja NKJV
feature_12: >
  Võrguühenduseta: ainus kord, mil vajad internetti, on dokumentide allalaadimisel.
# UNUSED
feature_13: Uurimismärkmikud märkmete ja piibli viidete lisamiseks jutluste kuulamisel.
subtitle_3: Loome koos parima piiblirakenduse!
paragraph_3_1: >
  AndBible on avatud lähtekoodiga kogukonna projekt. Praktikas tähendab see, et igaüks, kellel on sobivad oskused, saab ja on julgustatud projektile kaasa aitama:
contr_1: uute funktsioonide arendamine,
contr_2: veel avaldamata funktsioonide testimine,
contr_3: kasutajaliidese tõlgete ajakohane hoidmine ja
contr_4: >
  moodulite kogu laiendamise abistamine autoriõiguse omajatelt lubade hankimise või dokumentide SWORD formaati teisendamise teel.
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
paragraph_4_1: >
  Kui oled professionaalne tarkvarainsener või testija, palun kaatle projektile panustamist. Lisateavet kaasa aitamise kohta leiad aadressilt {{how_to_contribute_url}}.
