# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "AndBible: İncil Çalışması"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "Güçlü Kutsal Kitap çalışma seti: yorumlar, yer imleri, notlar, YZ"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: Güçlü Kutsal Kitap çalışma aracı
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  "{{ title }}", Android için güçlü, kullanımı kolay ve çevrimdışı çalışan bir Kutsal Kitap çalışma uygulamasıdır — gündelik okumadan derinlemesine araştırmaya kadar pek çok çalışma tarzına hizmet eden, yüksek kaliteli özelliklerden oluşan çok yönlü bir araç setidir. Yalnızca bir okuyucudan çok daha fazlası: ciddi bireysel çalışma için bir araçtır.
paragraph_1_2: >
  Kutsal Kitap okuyucuları tarafından, Kutsal Kitap okuyucuları için geliştirildi — kâr amacı gütmeyen, açık kaynaklı bir topluluk projesi; tamamen ücretsiz ve reklam içermez.
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >
  KJV, NASB, NET gibi birkaç popüler İncil versiyonu (mevcut birçok versiyon arasından) ve ayrıca Matthew Henry ve John Gill gibi popüler yorumları.
subtitle_2: Güçlü İncil Çalışma özellikleri
paragraph_2_1: >
  Uygulama, karmaşık ve derin bir Kutsal Kitap çalışma deneyimini daha sorunsuz hale getiren birçok aydınlatıcı, orijinal özelliğe sahiptir. En dikkat çekici özellikler aşağıdaki gibidir:
feature_01: "Çevirileri karşılaştırmayı ve yorumlara başvurmayı sağlayan bölünmüş metin görünümleri\n"
feature_02: "Çalışma alanları, kendi ayarlarına sahip birden fazla Kutsal Kitap çalışma kurulumuna izin verir\n"
feature_03: "Strong’un sözlüğü entegrasyonla birlikte Grekçe ve İbranice kelime analizine olanak sağlar\n"
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  Bağlantılı çapraz referansları, dipnotları ve yorumları ({{commentary_examples}}) veya çapraz referans koleksiyonlarını ({{cross_reference_examples}}) takip etmek için herhangi bir bağlantıya dokunun.
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: "Gill, Matthew Henry vb."
# Examples of cross-reference collections.
cross_reference_examples: "Kutsal Kitap Bilgisinin Hazinesi, TSKe"
feature_05: "Konuşma imleri ile gelişmiş metin okuma özelliği, sorunsuz bir Kutsal Kitap dinleme deneyimi sağlar\n"
feature_06: Bir veya birden çok Kutsal Kitap çevirisinde aynı anda esnek tam metin araması
feature_07: Gelişmiş yer imi
feature_08: >
  Cihazlar arası senkronizasyon: çalışma alanlarınızı, yer imlerinizi, notlarınızı ve okuma ilerlemenizi tüm cihazlarınızda eşitleyin
feature_09: >
  Okuma ve ezberleme takibi: okuma hedefleri belirleyin, ilerlemenizi izleyin ve ayetleri etkileşimli Kelime Karıştırma, Kelime Sıralama, Kelime Bulanıklaştırma ve Yazarak Ezberleme modlarıyla ezberleyin
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  Geniş belge kütüphanesi: Crosswire ve diğer SWORD depoları tarafından yasal olarak dağıtılan {{total_languages}} üzerinde dilde {{total_documents}} belgeden oluşan Kutsal Kitap çevirileri, teolojik yorumlar, sözlükler, haritalar ve Hristiyan kitapları.
feature_10_1: >
  MyBible, MySword ve EPUB dosyaları için yerel destek, kitaplığınızı daha da genişletmenizi sağlar.
feature_11: >
  İsteğe bağlı YZ çalışma asistanı (yalnızca isteğe bağlı — harici bir hizmet için kendi API anahtarınızı gerektirir): yüklü yorumlarınızı ve sözlüklerinizi seçtiğiniz dilde yapay zeka yardımıyla keşfedin, ayrıca diğer yaratıcı çalışma akışlarından yararlanın. Yerleşik bir izin sistemi, asistanın neler yapabileceği konusunda kontrolün tamamen sizde kalmasını sağlar.
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: "ESV, NIV ve NKJV"
feature_12: >-
  Çevrimdışı: İnternete ihtiyaç duyduğunuz tek zaman belgeleri indirmek içindir.
# UNUSED
feature_13: >
  Vaazları dinlerken notlar ve Kutsal Kitap referansları eklemek için Çalışma Pedleri.
subtitle_3: Birlikte en iyi Kutsal Kitap uygulamasını yapalım!
paragraph_3_1: >
  AndBible açık kaynaklı bir topluluk projesidir. Pratikte bu, uygun becerilere sahip herkesin
contr_1: "yeni özellikler geliştirerek,"
contr_2: "henüz yayımlanmamış özellikleri test ederek,"
contr_3: "kullanıcı arayüzü çevirilerini güncel tutarak, ve"
contr_4: "telif hakkı sahiplerinden izinler alarak veya belgeleri SWORD formatına dönüştürerek modül kitaplığının genişletilmesine yardımcı olarak.\n"
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
paragraph_4_1: "Profesyonel bir yazılım mühendisi ya da testçi iseniz lütfen projeye katkıda bulunmayı düşünün. Nasıl katkıda bulunacağınız hakkında daha fazla bilgi sahibi olmak için lütfen bakınız {{how_to_contribute_url}}.\n"
