# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "ஆண்ட் பைபில்: பைபில் ஸ்டடி"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "சக்திவாய்ந்த விவிலிய ஆய்வுக்கருவி: விளக்கவுரைகள், புக்மார்க்கு, குறிப்புகள், AI"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: சக்திவாய்ந்த விவிலிய ஆய்வு கருவி
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  "{{ title }}" என்பது Android க்கான சக்திவாய்ந்த, பயன்படுத்த எளிதான, ஆஃப்லைன் விவிலிய ஆய்வுச் செயலி — சாதாரண வாசிப்பிலிருந்து ஆழமான ஆராய்ச்சி வரை, பல்வேறு ஆய்வு பாணிகளுக்கு உதவும் உயர்தர அம்சங்களைக் கொண்ட பல்துறை கருவித்தொகுப்பு. இது வெறுமனே ஒரு வாசிப்புக் கருவி அல்ல — தீவிரமான தனிப்பட்ட ஆய்வுக்கான கருவியாகும்.
paragraph_1_2: >
  விவிலிய வாசகர்களால், விவிலிய வாசகர்களுக்காகவே உருவாக்கப்பட்டது — இலாப நோக்கற்ற, திறந்த மூல சமூகத் திட்டம், முற்றிலும் இலவசம், விளம்பரங்கள் இல்லை.
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >
  (இதில் கிடைக்கக்கூடிய பலவற்றில்) புகழ் பெற்ற விவிலிய பதிப்புகளான KJV, NASB, NET, அதோடு மேத்யூ ஹென்றி, ஜான் கில் போன்றவர்களின் விளக்க உரைகள்.
subtitle_2: விவிலிய ஆய்வுக்காக சக்தி வாய்ந்த அம்சங்கள்
paragraph_2_1: >
  இதில் உள்ள பல ஆழ்ந்த மற்றும் தனித்துவமான அம்சங்கள், ஆழமான விவிலிய ஆய்வு அனுபவத்தை முன்னெப்போதையும் விட எளிமையாக்குகிறது. குறிப்பிடத்தக்க அம்சங்கள் பின்வருமாறு:
feature_01: "மொழிபெயர்ப்புகளை ஒப்பிடவும் விளக்க உறைகளை காண உதவு திரையினை பிரிக்கும் Split text views\n"
feature_02: பல விவிலிய ஆய்வுகளை நடத்த ஏதுவாக தனி அமைப்புகளுடன் Workspaces
feature_03: "Strong's ஒருங்கிணைப்பு கிரேக்க மற்றும் எபிரேய பதங்களின் பகுப்பாய்வை எளிமையாக்குகின்றது\n"
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  எந்த இணைப்பையும் தட்டினால், அதனுடன் இணைக்கப்பட்ட குறுக்கு குறிப்புகள், அடிக்குறிப்புகள் மற்றும் விளக்கவுரைகள் ({{commentary_examples}}) அல்லது குறுக்கு குறிப்புத் தொகுப்புகளை ({{cross_reference_examples}}) பின்தொடரலாம்.
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: "Gill, Matthew Henry etc."
# Examples of cross-reference collections.
cross_reference_examples: "Treasure of Scripture Knowledge, TSKe"
feature_05: "விவிலியத்தை கேட்கும் அனுபவத்தை மென்மையாக்க ஸ்பீக் புக்மார்க்குகளுடன் கூடிய மேம்பட்ட பேச்சுமுறை உடையது\n"
feature_06: "ஒரே நேரத்தில் ஒன்று அல்லது பல விவிலிய மொழிபெயர்ப்புகளில் நெகிழ்வான முழு-உரை தேடல்\n"
feature_07: "தனிப்பட்ட ஆய்வுக் குறிப்புகளுடன் மேம்பட்ட புக்மார்க்கிங் மற்றும் அடிக்கோடிடும் சிறப்பம்சங்கள்\n"
feature_08: >
  சாதனங்கள் இடையே ஒத்திசைவு: உங்கள் பணியிடங்கள், புக்மார்க்குகள், குறிப்புகள் மற்றும் வாசிப்பு முன்னேற்றத்தை அனைத்து சாதனங்களிலும் ஒத்திசைவாக வைத்திருக்கவும்
feature_09: >
  வாசிப்பு மற்றும் மனனப் பயிற்சி கண்காணிப்பு: வாசிப்பு இலக்குகளை அமைக்கவும், முன்னேற்றத்தைக் கண்காணிக்கவும், மற்றும் ஊடாடும் சொற்குழப்பம் (Word Scramble), சொல் வரிசை (Word Order), சொல் மங்கல் (Word Blur), தட்டச்சு (Type It) ஆகிய முறைகள் மூலம் வசனங்களை மனனம் செய்யவும்
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  பலவகை கோப்புகள்: விவிலிய மொழிபெயர்ப்புகள், இறையியல் விளக்கங்கள், அகராதிகள், வரைபடங்கள் மற்றும் கிறிஸ்தவ புத்தகங்கள், மொத்தம் {{total_documents}} க்கும் மேற்பட்ட {{total_languages}} மொழிகளில் உள்ள ஆவணங்கள், Crosswire மற்றும் பிற SWORD களஞ்சியங்களால் விநியோகிக்கப்படுகின்றன.
feature_10_1: >
  MyBible, MySword மற்றும் EPUB கோப்புகளுக்கான வசதி உங்கள் நூலகத்தை இன்னும் பெருக்க உதவுகிறது.
feature_11: >
  விருப்பத்தேர்வான AI ஆய்வு உதவியாளர் (தாங்களாகவே இணைய வேண்டும் — உங்கள் சொந்த API விசை தேவை): நிறுவிய விளக்கவுரைகள் மற்றும் அகராதிகளை AI உதவியுடன் ஆராயலாம். உள்ளமைந்த அனுமதி அமைப்பு, உதவியாளரின் செயல்பாடுகளில் உங்களுக்கு முழு கட்டுப்பாட்டை வழங்குகிறது.
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: "ESV, NIV மற்றும் NKJV"
feature_12: >-
  ஆஃப்லைன்: ஆவணங்களைப் பதிவிறக்குவதற்கு மட்டுமே இணையம் தேவைப்படும்.
# UNUSED
feature_13: >-
  மறைஉரைகளைக் கேட்கும்போதே குறிப்புகள் எடுக்க ஸ்டடி பேட்கள்.
subtitle_3: சிறந்த விவிலிய மென்பொருளினை இணைந்து உருவாக்குவோம்!
paragraph_3_1: >
  ஆண்ட் பைபில் ஒரு திறவூற்று திட்டமாகும். ஆகவே தகுந்த திறனுடைய எவரும் இத்திட்டத்திற்கு பின்வரும் வழிகளில் பங்களிக்கலாம்:
contr_1: "புதிய அம்சங்களை உருவாக்குதல்,"
contr_2: "இன்னும் வெளியிடப்படாத அம்சங்களை சோதனை செய்தல்,"
contr_3: "இடைமுக மொழிபெயர்ப்புகளை புதுப்பித்த நிலையில் வைத்திருத்தல், மற்றும்"
contr_4: "பதிப்புரிமையாளர்களிடமிருந்து அனுமதிகளைப் பெறுவதன் மூலம் அல்லது ஆவணங்களை SWORD வடிவத்திற்கு மாற்றுவதன் மூலம் தொகுதி நூலகத்தை நீட்டிக்க உதவுவது.\n"
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
paragraph_4_1: "நீங்கள் ஒரு மென்பொருள் பொறியாளரோ அல்லது சோதனையாளராகவோ இருந்தால், திட்டத்தில் பங்களிக்களாம். எவ்வாறு பங்களிப்பது என அறிய காண்க:  {{how_to_contribute_url}}.\n"
subtitle_4: இணைப்புகள்
