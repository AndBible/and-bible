# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "AndBible: Studi Biblici"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "Studio biblico: commentari, segnalibri, annotazioni, strumenti IA"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: Un potente strumento di studio della Bibbia
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  «{{ title }}» è una potente app di studio biblico offline per Android, facile da usare — una cassetta degli attrezzi versatile per ogni stile di studio, dalla lettura occasionale alla ricerca approfondita. Più di un lettore: un vero strumento per lo studio personale.
paragraph_1_2: >
  Sviluppata da lettori della Bibbia, per lettori della Bibbia — un progetto comunitario open source senza scopo di lucro, completamente gratuito e senza pubblicità.
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >
  Alcune note versioni della Bibbia (tra le tante disponibili) sono KJV, NASB, NET, e anche commentari popolari come quelli di Matthew Henry e di John Gill.
subtitle_2: Un potente strumento di studio della Bibbia
paragraph_2_1: >
  L'applicazione ha molte caratteristiche intuitive e originali, che rendono una complessa esperienza di studio della Bibbia più agevole che mai. Le caratteristiche più interessanti sono le seguenti:
feature_01: "Le finestre di testo separate permettono di confrontare le traduzioni e consultare i commentari\n"
feature_02: "Le aree di lavoro consentono ambienti separati di studio biblico con impostazioni differenti\n"
feature_03: "L'integrazione dei numeri Strong consente l'analisi delle parole in greco ed ebraico\n"
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  Tocca qualsiasi collegamento per seguire riferimenti incrociati, note a piè di pagina e commentari ({{commentary_examples}}) o raccolte di riferimenti incrociati ({{cross_reference_examples}}).
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: "Gill, Matthew Henry, ecc."
# Examples of cross-reference collections.
cross_reference_examples: "Treasure of Scripture Knowledge, TSKe"
feature_05: "Sintesi vocale avanzata con segnalibri parlati, che permette una comoda esperienza di ascolto della Bibbia\n"
feature_06: "Ricerca flessibile a testo integrale in una o più traduzioni della Bibbia contemporaneamente\n"
feature_07: Segnalibri ed evidenziazione avanzata con note di studio personali
feature_08: >
  Sincronizzazione tra dispositivi: mantieni spazi di lavoro, segnalibri, annotazioni e progressi di lettura sincronizzati su tutti i tuoi dispositivi
feature_09: >
  Monitoraggio della lettura e memorizzazione: imposta obiettivi di lettura, traccia i progressi e memorizza i versetti con le modalità interattive Parole Mescolate, Ordine delle Parole, Parole Sfocate e Digita Tu
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  Vasta biblioteca di documenti: traduzioni della Bibbia, commentari teologici, dizionari, mappe e libri cristiani, per un totale di oltre {{total_documents}} documenti in oltre {{total_languages}} lingue, distribuiti legalmente da Crosswire e altri repository SWORD.
feature_10_1: >
  La compatibilità nativa con i file MyBible, MySword ed EPUB consente di ampliare ulteriormente la propria libreria.
feature_11: >
  Agente di studio IA opzionale (attivazione facoltativa, richiede una tua chiave API per un servizio esterno): esplora commentari e dizionari con l'IA nella lingua scelta. Sistema di autorizzazioni integrato per il pieno controllo.
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: "ESV, NIV e NKJV"
feature_12: >-
  Offline: l'unica volta che hai bisogno di internet è per scaricare i documenti.
# UNUSED
feature_13: >
  Appunti di studio per aggiungere annotazioni e riferimenti biblici durante l'ascolto dei sermoni.
subtitle_3: Creiamo insieme la migliore app della Bibbia!
paragraph_3_1: >
  AndBible è un progetto della community open-source. In pratica, ciò significa che chiunque abbia le competenze adeguate può contribuire al progetto ed è incoraggiato a farlo:
contr_1: "sviluppando nuove funzionalità,"
contr_2: "testando le nuove caratteristiche,"
contr_3: "mantenendo aggiornate le traduzioni dell'interfaccia utente, e"
contr_4: "aiutando ad estendere la libreria dei moduli ottenendo i permessi dai detentori del copyright, o convertendo i documenti in formato SWORD.\n"
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
paragraph_4_1: "Se sei uno sviluppatore software o un tester, per favore considera di contribuire al progetto. Per maggiori informazioni su come contribuire, vedi {{how_to_contribute_url}}.\n"
