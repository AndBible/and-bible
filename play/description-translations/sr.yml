# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "Анд Библија: Учење Библије"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "Моћан алат за проучавање Библије: тумачења, обележивачи, белешке, аи"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: Моћно средство за учење Библије
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  „{{ title }}" је моћна, лака за коришћење, офлајн апликација за проучавање Библије за Андроид — свестран алат са висококвалитетним функцијама које служе многим начинима проучавања, од опуштеног читања до дубинског истраживања. Више од читача, ово је алат за озбиљно лично проучавање.
paragraph_1_2: >
  Развили су је читаоци Библије, за читаоце Библије — непрофитни пројекат заједнице отвореног кода који је потпуно бесплатан и не садржи рекламе.
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >
  Неколико најпознатијих превода Библије (од многих доступних) су KJV, NASB, NET и такође популарна тумачења као што су тумачења Метју Хенрија и Џон Гила.
subtitle_2: Моћне функције за проучавање Библије
paragraph_2_1: >
  Апликација има многе оригиналне функције које чине детаљно проучавање Библије лакшим него икад. Значајне функције су следеће:
feature_01: Дељење прегледа текста које омогућава упоређивање превода и тражење у тумачењима
feature_02: "Радне површи омогућавају више поставки за проучавање Библије са одвојеним подешавањима\n"
feature_03: Интеграција Стронговог речника омогућава анализу грчких и хебрејских речи
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  Тапните било који линк да бисте пратили унакрсне референце, фусноте и тумачења ({{commentary_examples}}) или збирке унакрсних референци ({{cross_reference_examples}}).
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: "Gill, Matthew Henry итд."
# Examples of cross-reference collections.
cross_reference_examples: "Treasure of Scripture Knowledge, TSKe"
feature_05: "Напредни текст - у - говор са изговором обележивача, које омогућава глатки доживаљај слушања Светога Писма\n"
feature_06: "Флексибилна претрага пуног текста кроз један или више библијских превода истовремено\n"
feature_07: Напредно обележавање и истицање са личним белешкама за учење
feature_08: >
  Синхронизација између уређаја: одржавајте Ваше радне површи, обележиваче, белешке и напредак читања синхронизованим на свим Вашим уређајима
feature_09: >
  Праћење читања и меморисања: поставите циљеве читања, пратите напредак и меморишите стихове помоћу интерактивних режима Помешане Речи, Редослед Речи, Замућене Речи и Откуцај
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  Огромна библиотека докумената: Библијских превода, теолошких тумачења, речника, карата, и хришћанских књига, чији укупан број излази на преко {{total_documents}} докумената на више од {{total_languages}} језика, легално дистрибуираних од стране Crosswire и других SWORD ризница.
feature_10_1: >
  Изворна подршка за MyBible, MySword и EPUB фајлове омогућава Вам да још више проширите Вашу библиотеку.
feature_11: >
  Опциони аи агент за проучавање (само на захтев — захтева Ваш сопствени АПИ кључ за спољни сервис): истражујте инсталирана тумачења и речнике уз помоћ аи на изабраном језику, плус други креативни начини проучавања. Уграђени систем дозвола омогућава Вам пуну контролу над тиме шта агент може да ради.
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: "ESV, NIV и NKJV"
feature_12: >-
  Офлајн: једино када вам треба интернет јесте за преузимање докумената.
# UNUSED
feature_13: >-
  Радне Свеске за додавање белешки и библијских референци за време слушања беседа.
subtitle_3: Хајде да заједно направимо најбољу Библијску апликацију!
paragraph_3_1: >
  AndBible је пројекат заједнице отвореног-кода. У пракси, ово значи да свако ко има одређени низ вештина може, уз охрабрење, да допринесе пројекту:
contr_1: развијањем нових функција
contr_2: тестирањем још увек не објављених функција
contr_3: "одржавањем превода корисничког сучеља ажурним, и"
contr_4: "помажући ширењем модула библиотеке задобијањем дозвола власника ауторских права, или конвертовањем докумената у SWORD формат.\n"
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
paragraph_4_1: "Уколико сте Ви професионални софтверски програмер или испитивач, молимо Вас да размислите о доприносу пројекту. За више информација о томе како допринети, молимо погледајте {{how_to_contribute_url}}.\n"
