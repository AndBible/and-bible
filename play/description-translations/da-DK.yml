# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "AndBible: Bibelstudium"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: Læs Bibelen, studér kommentarer og ordbøger, eller læs bøger offline.
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: Kraftfuldt bibelstudieværktøj
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  "{{ title }}" er en kraftfuld, men nem at bruge, offline bibelstudieapp til Android. Appen sigter ikke blot mod at være en biblæser, men fokuserer på at være et avanceret værktøj til dybdegående personligt bibelstudium.
paragraph_1_2: >
  Denne app er udviklet af bibelentusiaster, til bibelentusiaster. Den hjælper dig med at gøre dit bibelstudium bekvemt, dybdegående og sjovt. Det bedste ved dette non-profit fællesskabsprojekt er, at det er open source, helt gratis og reklamefrit.
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >
  Nogle populære Bibeloversættelser (blandt de mange tilgængelige) er KJV, NASB, NET, samt populære kommentarer som Matthew Henry og John Gill.
subtitle_2: Kraftfulde bibelstudieegenskaber
paragraph_2_1: >
  Appen har mange indsigtsfulde og originale funktioner, der gør et komplekst og dybdegående bibelstudium nemmere end nogensinde. De mest bemærkelsesværdige funktioner er:
feature_01: >
  Delt tekstvisning til sammenligning af oversættelser og konsultation af kommentarer
feature_02: >
  Arbejdsrum giver mulighed for flere bibelstudieopsætninger med egne indstillinger
feature_03: Strong's integration muliggør analyse af græske og hebraiske ord
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  Koblede krydsreferencer, fodnoter og dokumenter; hop til krydsreferencer og fodnoter ved blot at trykke på et link; foretag dybdegående studium af Skriften ved hjælp af hyperlinks til kommentarer ({{commentary_examples}}), krydsreferencesamlinger ({{cross_reference_examples}}) og andre ressourcer.
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: Gill, Matthew Henry m.fl.
# Examples of cross-reference collections.
cross_reference_examples: Treasure of Scripture Knowledge, TSKe
feature_05: Avanceret tekst-til-tale med tale-bogmærker for en jævn bibeloplevelse
feature_06: Fleksibel søgning
feature_07: Avancerede bogmærke- og fremhævningsfunktioner med personlige studienotater
feature_09: "Læseplaner: sæt mål for din Bibellæsning"
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  Stort dokumentbibliotek: Bibeloversættelser, teologiske kommentarer, ordbøger, kort og kristne bøger – i alt over {{total_documents}} dokumenter på over {{total_languages}} sprog, lovligt distribueret af Crosswire og andre SWORD-arkiver.
feature_10_1: >
  Indbygget understøttelse af MyBible, MySword og EPUB-filer giver dig mulighed for at udvide dit bibliotek endnu mere.
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: ESV, NIV og NKJV
feature_12: "Offline: du behøver kun internet til downloading af dokumenter."
# UNUSED
feature_13: >
  Studiepads til at tilføje noter og Bibelhenvisninger, mens du lytter til prædikener.
subtitle_3: Lad os bygge den bedste Bibelapp sammen!
paragraph_3_1: >
  AndBible er et open source-fællesskabsprojekt. I praksis betyder det, at alle med de rette færdigheder kan – og opfordres til – at bidrage til projektet ved at:
contr_1: udvikle nye funktioner,
contr_2: teste endnu ikke udgivne funktioner,
contr_3: holde brugergrænsefladesoversættelser ajour, og
contr_4: >
  hjælpe med at udvide modulbiblioteket ved at indhente tilladelser fra rettighedshavere eller ved at konvertere dokumenter til SWORD-format.
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
paragraph_4_1: >
  Er du professionel softwareudvikler eller tester, er du velkommen til at bidrage til projektet. For mere information om, hvordan du bidrager, se {{how_to_contribute_url}}.
