# Long version of app name that will be displayed on Play Store. (max 30 characters)
title: "AndBible: Изучение Библии"
# Short promotional text, shown in Play Store (max 80 characters)
short_description: "Изучение Библии: комментарии, закладки, заметки, ИИ-помощник"
# Main (first) subtitle of the Play Store main (long) description text.
subtitle_1: Мощный инструмент для изучения Библии
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
paragraph_1_1: >
  «{{ title }}» — мощное и удобное офлайн-приложение для изучения Библии на Android. Универсальный набор качественных инструментов для разных подходов — от обычного чтения до глубокого исследования. Больше, чем читалка: инструмент для серьёзного личного изучения.
paragraph_1_2: >
  Создано читателями Библии для читателей Библии — некоммерческий проект с открытым исходным кодом, полностью бесплатный и без рекламы.
# You can also advertise here the best documents that are available in the app in your language.
paragraph_1_3: >
  Несколько популярных версий Библии (из многих доступных) - это Синодальные переводы, пер. Кассиана, Лутковского, а также популярные комментарии, такие как Лопухина, Баркли, Новой Женевской Библии.
subtitle_2: Мощные возможности для изучения Библии
paragraph_2_1: >
  Приложение имеет множество интересных, оригинальных функций, которые делают сложное и глубокое изучение Библии более простым, чем когда-либо. Наиболее примечательными особенностями являются следующие:
feature_01: "Разделение текстовых представлений, позволяющих сравнивать переводы и комментарии\n"
feature_02: "Рабочие области позволяют использовать несколько установок для изучения Библии с собственными настройками.\n"
feature_03: Интеграция Стронга позволяет анализировать слова на греческом и иврите
# Please add variables marked with curly braces also in your translation untranslated, in correct places!
feature_04: >
  Нажмите на любую ссылку для перехода к перекрёстным ссылкам, примечаниям и комментариям ({{commentary_examples}}) или коллекциям перекрёстных ссылок ({{cross_reference_examples}}).
# Examples of commentaries. You can add here also other commentaries of your language if they
# are found in the app.
commentary_examples: "Толковая Библия Лопухина, Комментарии Баркли к НЗ, Комментарии Новой Женевской Библии и др.\n"
# Examples of cross-reference collections.
cross_reference_examples: "Словарь Брокгауза, Л.И. Василенко, Энциклопедия архимандрита Никифора и др."
feature_05: "Преобразование текста в речь с закладками для голосового управления, обеспечивающими комфортное прослушивание Библии\n"
feature_06: "Гибкий полнотекстовый поиск по одному или нескольким переводам Библии одновременно\n"
feature_07: Расширенные функции закладок и выделения с личными заметками
feature_08: >
  Синхронизация между устройствами: рабочие области, закладки, заметки и прогресс чтения
feature_09: >
  Отслеживание чтения и заучивание: цели, прогресс и заучивание стихов в режимах «Перемешанные слова», «Порядок слов», «Размытые слова» и «Введите сами»
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
feature_10: >
  Обширная библиотека ресурсов: переводы Библии, богословские комментарии, словари, карты и христианские книги, в общей сложности более {{total_documents}} ресурсов на более чем {{total_languages}} языках, легально распространяемых Crosswire и другими хранилищами SWORD.
feature_10_1: >
  Встроенная поддержка файлов MyBible, MySword и EPUB позволяет вам еще больше расширить свою библиотеку.
feature_11: >
  Опциональный ИИ-помощник (по желанию, нужен собственный API-ключ): изучайте установленные комментарии и словари с помощью ИИ. Встроенная система разрешений оставляет контроль за вами.
# In addition or in addition to the mentioned documents also some of the commercial/modern bible
# versions / documents of your language that are not (yet) available in the app.
unavailable_documents: "ESV, NIV and NKJV"
feature_12: >-
  Офлайн: Интернет нужен только для загрузки ресурсов.
# UNUSED
feature_13: >
  Блокноты для добавления заметок и ссылок на стихи Библии во время прослушивания проповедей.
subtitle_3: Давайте вместе сделаем самое лучшее приложение для Библии!
paragraph_3_1: >
  AndBible — это проект сообщества с открытым исходным кодом. На практике это означает, что любой человек, обладающий соответствующими навыками, может и поощряется вносить свой вклад в проект:
contr_1: "разработка новых функций,"
contr_2: "тестирование еще не выпущенных функций,"
contr_3: поддержание актуальности переводов пользовательского интерфейса и
contr_4: "помощь в расширении библиотеки ресурсов путем получения разрешений от правообладателей или путем преобразования документов в формат SWORD.\n"
# Please add variables marked with curly braces also in your translated, untranslated, in correct places!
paragraph_4_1: "Если вы профессиональный инженер-программист или тестировщик, рассмотрите возможность участия в проекте. Дополнительную информацию о том, как внести свой вклад, см. на странице  {{how_to_contribute_url}}.\n"
