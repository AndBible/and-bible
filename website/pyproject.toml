[project]
name = "andbible-website"
version = "0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
site = [
  "zensical==0.0.67",
  "jinja2>=3.1",
  "markdown>=3.7",
  "pymdown-extensions>=10.12",
  "pyyaml>=6.0",
  "pillow>=11.0",
  "pytest>=8.3",
]
migrate = [
  "beautifulsoup4>=4.12",
  "markdownify>=0.14",
  "sphinx>=7",
  "sphinx-rtd-theme>=2",
]

[tool.uv]
package = false
default-groups = ["site"]

[tool.pytest.ini_options]
testpaths = ["tests"]
