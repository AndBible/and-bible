# The AndBible 6.0 video series on andbible.org: order, titles, docs pages and YouTube ids.
#
# Hand-maintainable and public: the site build reads only this file, never website/video/.
# - slug: the episode folder under website/video/episodes/ (and TutorialVideos.kt's enum name, lower-cased, `-` for `_`).
# - youtube: null until the episode is published. `youtube_upload.py` fills it in after an upload (and prints the
#   TutorialVideos.kt line). While null, the docs page shows a "Coming soon" note and /videos/ the placeholder.
# - placeholder: the unlisted "videos coming soon" video (same id as TutorialVideos.PLACEHOLDER_VIDEO_ID).
# - docs / anchor: the docs page stem (relative to docs/, no .md) the episode is embedded in, and an optional heading anchor.
# website/tests/test_tutorials.py keeps this file in step with TutorialVideos.kt.
