# Old path -> new path or absolute URL. Paths ending in "/" are directories
# (written as <path>index.html); others are files (e.g. /privacy.html).
# A bare "/x" entry cannot coexist with a "/x/" entry (file vs directory);
# GitHub Pages redirects /x to /x/ itself when the directory exists.
# A site-path target must exist in the built site, or the build fails.
/privacy.html: /privacy/
/terms.html: /terms/
/about/: /
/sponsor-andbible-financially/: https://shop.andbible.org/page/info
/buy/: https://shop.andbible.org/page/info

# Targets that do not exist yet: /flyers/ arrives in Task 12, /videos/ in Task
# 18. load() ignores this key; each task moves its entry up when its target exists.
pending:
  /tutorial-videos/: /videos/
  /printable-promotional-material/: /flyers/
