{% extends "base.html" %}
{% block content %}
<section class="videos">
  <h1>{{ strings.videos.title }}</h1>
  <p class="videos__intro">{{ strings.videos.intro }}</p>
  {% for topic, embeds in sections %}
  <section class="videos__topic" aria-labelledby="topic-{{ loop.index }}">
    <h2 id="topic-{{ loop.index }}">{{ topic }}</h2>
    <div class="video-grid">
      {% for embed in embeds %}<div>{{ embed }}</div>{% endfor %}
    </div>
  </section>
  {% endfor %}
</section>
{% endblock %}
