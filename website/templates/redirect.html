<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Redirecting…</title>
{% if noindex is not defined or noindex %}<meta name="robots" content="noindex">
{% endif %}<link rel="canonical" href="{{ target if target.startswith('https://') else base_url ~ target }}">
<meta http-equiv="refresh" content="0; url={{ target }}">
<script>location.replace({{ target | tojson }} + location.hash)</script>
</head><body><p>This page has moved to <a href="{{ target }}">{{ target }}</a>.</p></body></html>
