# Robolectric emulates the package's targetSdk by default. The app targets API 36
# (Google Play requirement from 31 Aug 2026) but Robolectric 4.14.1 — pinned because
# Roborazzi's Compose capture needs native graphics — supports at most API 35, and
# refuses to configure a test class with "targetSdkVersion=36 > maxSdkVersion=35".
#
# Pin the emulated SDK to 35, which is what these tests ran at before the targetSdk
# bump. Classes that need a different level keep overriding it with @Config(sdk=...).
# Drop this file once Robolectric is bumped to a release that supports API 36.
sdk=35
